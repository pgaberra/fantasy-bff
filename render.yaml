services:
  - type: web
    name: fantasy-bff-staging
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # Run with the staging profile (real downstream services, CORS from WEB_ORIGIN).
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      # 256-bit+ signing key for HS256 JWTs; Render generates a long random value.
      - key: JWT_SECRET
        generateValue: true
      # fantasy-db-service public URL on Render.
      - key: DATABASE_SERVICE_URL
        value: https://fantasy-db-service.onrender.com
      # Pre-shared secret for BFF → db-service auth. Must match INTERNAL_API_KEY
      # set on the fantasy-db-service. Generate with: openssl rand -hex 32
      - key: DB_INTERNAL_API_KEY
        sync: false
      # fantasy-nhl-service public URL on Render.
      - key: NHL_SERVICE_URL
        value: https://fantasy-nhl-service.onrender.com
      # Pre-shared secret for BFF → nhl-service auth. Must match INTERNAL_API_KEY
      # set on the fantasy-nhl-service.
      - key: NHL_INTERNAL_API_KEY
        sync: false
      # fantasy-yahoo-service public URL on Render (the onrender URL is fine for
      # internal BFF→service calls; Yahoo's custom-domain rule only applies to the
      # OAuth callback, which the browser hits directly, not the BFF).
      - key: YAHOO_SERVICE_URL
        value: https://fantasy-yahoo-service.onrender.com
      # Pre-shared secret for BFF → yahoo-service auth. Must match INTERNAL_API_KEY
      # set on the fantasy-yahoo-service.
      - key: YAHOO_INTERNAL_API_KEY
        sync: false
      # Set this to the deployed web URL after the static site exists, then redeploy.
      - key: WEB_ORIGIN
        sync: false
      # Public Google OAuth Client ID for "Sign in with Google" (not a secret —
      # it is shipped to the browser by design).
      - key: GOOGLE_CLIENT_ID
        value: 404846934195-2840u7mkdapmstllgsiaft2gdgjb2c0g.apps.googleusercontent.com
