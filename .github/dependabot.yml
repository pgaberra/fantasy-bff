version: 2
# Dependabot runs Sunday evening and the Dependabot round (fantasy-workspace,
# .claude/skills/dependabot-round) merges what is green on Monday morning. The cooldown keeps a
# release out of a PR until it is a week old, so a compromised version has had a week to be
# noticed before it can reach staging. Security updates ignore the cooldown.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Stockholm
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
      all-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Stockholm
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      all-actions:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
