name: Tag & release on merge to master

# Auto-tag every squash-merge to master with a SemVer tag derived from the
# Conventional-Commit message (the squash commit is the PR title):
#   feat: -> minor, fix:/chore:/others -> patch, BREAKING CHANGE or "!" -> major.
# Also publishes a matching GitHub Release with the generated changelog.
# Baseline tag is v0.1.0; the action bumps from the latest existing tag.
on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: tag-on-merge
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
          CHANGELOG: ${{ steps.tag.outputs.changelog }}
        run: |
          printf '%s\n' "$CHANGELOG" > "$RUNNER_TEMP/notes.md"
          gh release create "$NEW_TAG" --title "$NEW_TAG" --notes-file "$RUNNER_TEMP/notes.md"

      # Tell the prod server (Coolify control plane) to stamp this tag as APP_VERSION on the
      # staging app and redeploy it, over a restricted SSH key whose only action is
      # /root/set_staging_version_forced.sh. This is staging's only deploy path once Coolify's
      # own auto-deploy is off, so a missing key fails the job instead of skipping quietly —
      # a silent skip would stop staging deploying with nothing but a notice to show for it.
      - name: Stamp staging version & redeploy
        if: steps.tag.outputs.new_tag != ''
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_VERSION_SSH_KEY }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::STAGING_VERSION_SSH_KEY is not set — staging cannot be stamped or deployed."
            exit 1
          fi
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_stagingver
          chmod 600 ~/.ssh/id_stagingver
          printf '%s\n' '157.180.126.72 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOt5tXmokoBw2Y5mUWlZSOzkgS/XU13hl4PeatHR4TB5' > ~/.ssh/known_hosts
          echo "Stamping staging $REPO_NAME version to $NEW_TAG"
          ssh -i ~/.ssh/id_stagingver -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            root@157.180.126.72 "$REPO_NAME $NEW_TAG"
