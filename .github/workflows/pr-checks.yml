name: PR Checks

on:
  # Not on push to master: a squash-merge lands byte-identical code to what the PR's own
  # pull_request run just tested, so a second full build+test here was pure duplication —
  # the single biggest line item in the account's Actions minutes. The trade-off: without
  # GitHub Pro we can't require this check before merge, so this was also the only net that
  # caught two PRs merging close together where the second wasn't rebased on the first.
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Passing BASE_SHA is what makes these only blame the branch: a producer merge staled the
      # pinned copy in every open PR at once, and with four producers that happened four times as
      # often. The script carries the whole argument.
      - name: Verify pinned db-service spec is in sync
        if: github.actor != 'dependabot[bot]'
        env:
          PRODUCER_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bash .github/scripts/check-pinned-spec.sh \
            pgaberra/fantasy-db-service specs/openapi.yaml specs/fantasy-db-service-openapi.yaml \
            './gradlew openApiGenerate and fix any compile errors'

      - name: Verify pinned yahoo-service spec is in sync
        if: github.actor != 'dependabot[bot]'
        env:
          PRODUCER_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bash .github/scripts/check-pinned-spec.sh \
            pgaberra/fantasy-yahoo-service specs/openapi.yaml specs/fantasy-yahoo-service-openapi.yaml \
            './gradlew generateYahooClient and fix any compile errors'

      - name: Verify pinned espn-service spec is in sync
        if: github.actor != 'dependabot[bot]'
        env:
          PRODUCER_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bash .github/scripts/check-pinned-spec.sh \
            pgaberra/fantasy-espn-service specs/openapi.yaml specs/fantasy-espn-service-openapi.yaml \
            './gradlew generateEspnClient and fix any compile errors'

      - name: Verify pinned projection-service spec is in sync
        if: github.actor != 'dependabot[bot]'
        env:
          PRODUCER_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bash .github/scripts/check-pinned-spec.sh \
            pgaberra/fantasy-projection-service specs/openapi.json specs/fantasy-projection-service-openapi.json \
            './gradlew generateProjectionClient and fix any compile errors'

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test & coverage
        run: ./gradlew build jacocoTestReport --no-daemon

      # SpotBugs only prints a path to an HTML report the runner throws away, which makes a
      # failure unreadable from the log alone. Print the findings instead.
      - name: Show SpotBugs findings
        if: failure()
        run: |
          for report in build/reports/spotbugs/*.xml; do
            [ -f "$report" ] || continue
            echo "== $report"
            grep -oE 'BugInstance type="[^"]+"|Class classname="[^"]+"|Method[^>]*name="[^"]+"|start="[0-9]+"' "$report" || true
          done

      - name: Publish coverage report
        uses: Madrapps/jacoco-report@v1.8.0
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        with:
          paths: '**/build/reports/jacoco/test/jacocoTestReport.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: 'Coverage Report — bff'
