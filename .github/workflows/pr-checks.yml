name: PR Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify pinned db-service spec is in sync
        env:
          GH_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
        run: |
          gh api repos/pgaberra/fantasy-db-service/contents/specs/openapi.yaml \
            -H "Accept: application/vnd.github.raw" > /tmp/db-openapi.yaml
          if ! diff -u specs/fantasy-db-service-openapi.yaml /tmp/db-openapi.yaml; then
            echo "::error::Pinned db-service spec is stale. Copy fantasy-db-service/specs/openapi.yaml into specs/fantasy-db-service-openapi.yaml, run ./gradlew openApiGenerate, and fix any compile errors."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test & coverage
        run: ./gradlew build jacocoTestReport --no-daemon

      - name: Publish coverage report
        uses: Madrapps/jacoco-report@v1.8.0
        if: github.event_name == 'pull_request'
        with:
          paths: '**/build/reports/jacoco/test/jacocoTestReport.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: 'Coverage Report — bff'
