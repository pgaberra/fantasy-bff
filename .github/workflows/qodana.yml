name: Qodana

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  checks: write

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Generate the OpenAPI client sources before Qodana imports the Gradle project,
      # so files referencing com.fantasy.bff.generated.* resolve during analysis.
      - name: Generate OpenAPI clients
        run: ./gradlew openApiGenerate generateYahooClient --no-daemon

      # Report-only: surfaces simplification/optimization findings in the run summary +
      # SARIF artifact for human review. Never fails the run — several of these
      # inspections (e.g. Boolean.TRUE.equals on a nominally-@Nonnull value that can still
      # be null at runtime) are false positives that must not block.
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        continue-on-error: true
        with:
          pr-mode: false
          upload-result: true
