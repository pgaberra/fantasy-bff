name: Qodana

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  # Temporary while validating; removed before merge (final state is weekly + manual).
  pull_request:
    branches: [master]

permissions:
  contents: read
  checks: write

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Generate the OpenAPI client sources before Qodana imports the Gradle project,
      # so files referencing com.fantasy.bff.generated.* resolve during analysis.
      - name: Generate OpenAPI clients
        run: ./gradlew openApiGenerate generateYahooClient --no-daemon

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        continue-on-error: true
        with:
          pr-mode: false
          upload-result: true
