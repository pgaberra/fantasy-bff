# Local development: the API docs are off in the base config (hardened by default), so the
# dev profile turns them back on explicitly.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

security:
  # Local development works on the model endpoints, so they are on here. Deployed environments
  # opt in with PROJECTION_MODEL_ENABLED.
  projection-model-enabled: true
  permitted-urls:
    - "/api/v1/auth/**"
    - "/api/v1/versions"
    - "/actuator/health"
    - "/swagger-ui/**"
    - "/swagger-ui.html"
    - "/v3/api-docs/**"
  cors-allowed-origins:
    - "http://localhost:4200"
  google:
    # Public OAuth Client ID (not a secret); the same client allows the
    # http://localhost:4200 JS origin, so local dev works out of the box.
    client-id: ${GOOGLE_CLIENT_ID:404846934195-2840u7mkdapmstllgsiaft2gdgjb2c0g.apps.googleusercontent.com}

email:
  # A local run usually has no Resend key. Here, and only here, a blank key is allowed: the app
  # then writes the reset and verification links to the log instead of sending them, so those
  # flows can be clicked through. Each link carries a live token, which is why the base config
  # refuses to start without a key instead.
  log-links: true
  resend:
    api-key: ${RESEND_API_KEY:}

feedback:
  github:
    # A local run usually has no GitHub token. The placeholder only lets the app start: GitHub
    # refuses it, so sending feedback locally answers 502 and files nothing.
    token: ${FEEDBACK_GITHUB_TOKEN:local-run-has-no-token}
