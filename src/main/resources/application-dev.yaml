security:
  permitted-urls:
    - "/api/v1/auth/**"
    - "/api/v1/versions"
    - "/actuator/health"
    - "/swagger-ui/**"
    - "/swagger-ui.html"
    - "/v3/api-docs/**"
  cors-allowed-origins:
    - "http://localhost:4200"
  google:
    # Public OAuth Client ID (not a secret); the same client allows the
    # http://localhost:4200 JS origin, so local dev works out of the box.
    client-id: ${GOOGLE_CLIENT_ID:404846934195-2840u7mkdapmstllgsiaft2gdgjb2c0g.apps.googleusercontent.com}
