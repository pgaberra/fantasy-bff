# Swagger UI / OpenAPI docs are env-gated: off by default in deployed environments
# (SWAGGER_ENABLED unset -> false) so production is hardened; staging sets
# SWAGGER_ENABLED=true to keep them for QA. Local dev (base profile) keeps them on.
# Safe: the web generates its client from the committed specs/bff-openapi.yaml, and
# OpenApiSpecSnapshotTest runs in the test profile — nothing depends on the live prod docs.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

security:
  permitted-urls:
    - "/api/v1/auth/**"
    - "/api/v1/versions"
    - "/actuator/health"
    - "/swagger-ui/**"
    - "/swagger-ui.html"
    - "/v3/api-docs/**"
  cors-allowed-origins:
    - ${WEB_ORIGIN:http://localhost:4200}
    # Lets a developer run the web locally (npm run start:staging) against staging
    # without booting the backend services.
    - http://localhost:4200

# No downstream timeout overrides: on the deployed Coolify environments the services
# are co-located on the same Docker network and respond in milliseconds, so the modest
# base timeouts in application.yaml apply. (The old large overrides only existed to
# absorb Render free-tier cold starts, which no longer apply.)
