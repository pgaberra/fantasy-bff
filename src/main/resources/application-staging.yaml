# Profile: staging — QA conveniences layered on top of the base config.
#
# This profile is deliberately NOT load-bearing. Everything production depends on — the CORS
# origin allowlist and the API-docs hardening — now lives in application.yaml and is driven by
# env vars, so a deployed instance is configured correctly whether or not a profile is active.
# Production therefore does not need to set SPRING_PROFILES_ACTIVE at all.
#
# All this adds is permitting the API-doc URLs, which staging exposes for QA by also setting
# SWAGGER_ENABLED=true. Permitting them is harmless when the docs are disabled — springdoc
# doesn't register the endpoints at all. Note that Spring does not merge list properties, so
# permitted-urls is redefined wholesale here rather than appended to the base list.
security:
  permitted-urls:
    - "/api/v1/auth/**"
    - "/api/v1/versions"
    - "/actuator/health"
    - "/swagger-ui/**"
    - "/swagger-ui.html"
    - "/v3/api-docs/**"

# No downstream timeout overrides: on the deployed Coolify environments the services
# are co-located on the same Docker network and respond in milliseconds, so the modest
# base timeouts in application.yaml apply. (The old large overrides only existed to
# absorb Render free-tier cold starts, which no longer apply.)
