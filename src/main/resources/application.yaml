spring:
  application:
    name: fantasy-bff
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

services:
  # These timeouts suit local dev, where downstream services run on localhost and
  # respond immediately. The staging profile raises them substantially to absorb
  # Render free-tier wake-up latency (see application-staging.yaml).
  nhl:
    base-url: ${NHL_SERVICE_URL:http://localhost:8087}
    timeout-ms: 5000
    api-key: ${NHL_INTERNAL_API_KEY:}
    # Season whose stats the projections are based on (NHL season id, e.g. 20252026).
    season: ${NHL_SEASON:20252026}
  yahoo-fantasy:
    base-url: ${YAHOO_SERVICE_URL:http://localhost:8084}
    timeout-ms: 7000
  database:
    base-url: ${DATABASE_SERVICE_URL:http://localhost:8086}
    timeout-ms: 3000
    api-key: ${DB_INTERNAL_API_KEY:}

security:
  permitted-urls:
    - "/api/v1/auth/**"
    - "/actuator/health"
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 2592000000  # 30 days

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
