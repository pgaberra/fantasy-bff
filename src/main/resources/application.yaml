spring:
  application:
    name: fantasy-bff
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

services:
  nhl:
    base-url: ${NHL_SERVICE_URL:http://localhost:8082}
    timeout-ms: 5000
  yahoo-fantasy:
    base-url: ${YAHOO_SERVICE_URL:http://localhost:8084}
    timeout-ms: 7000
  database:
    base-url: ${DATABASE_SERVICE_URL:http://localhost:8086}
    timeout-ms: 3000
    api-key: ${INTERNAL_API_KEY:}

security:
  permitted-urls:
    - "/api/v1/auth/**"
    - "/actuator/health"
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 2592000000  # 30 days

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
