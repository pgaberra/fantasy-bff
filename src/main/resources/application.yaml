spring:
  application:
    name: fantasy-bff
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

app:
  # Public base URL of the web app, used to build links in emails (e.g. the password
  # reset link). Reuses WEB_ORIGIN (also the CORS origin) so it points at the right env.
  web-base-url: ${WEB_ORIGIN:http://localhost:4200}

email:
  # Sender identity for transactional email (non-secret).
  from: ${EMAIL_FROM:SlapStat <no-reply@slapstat.com>}
  resend:
    # Resend API key. Secret; when unset the app logs reset links instead of sending
    # (local dev / CI / tests), mirroring the Sentry "inert when unconfigured" pattern.
    api-key: ${RESEND_API_KEY:}
    base-url: ${RESEND_BASE_URL:https://api.resend.com}
    timeout-ms: 5000

services:
  # Per-downstream read/connect timeouts (ms). These apply in every environment:
  # locally the services run on localhost, and on the deployed Coolify environments
  # they are co-located on the same Docker network — both respond quickly.
  # yahoo-service serves OAuth + the cached player read model (~1600 players); generous timeout.
  yahoo-fantasy:
    base-url: ${YAHOO_SERVICE_URL:http://localhost:8088}
    timeout-ms: 10000
    api-key: ${YAHOO_INTERNAL_API_KEY:}
  # espn-service reads a user's ESPN league (public leagues need only an id; private ones
  # use the stored espn_s2 + SWID cookies). Internal-only — no OAuth callback.
  espn-fantasy:
    base-url: ${ESPN_SERVICE_URL:http://localhost:8090}
    timeout-ms: 10000
    api-key: ${ESPN_INTERNAL_API_KEY:}
  database:
    base-url: ${DATABASE_SERVICE_URL:http://localhost:8086}
    timeout-ms: 3000
    api-key: ${DB_INTERNAL_API_KEY:}
  # projection-service serves AI-generated player projections (NHL-id-keyed, league-agnostic).
  # Internal-only. Not deployed yet — the BFF client is wired ahead of the seeding slice.
  projection:
    base-url: ${PROJECTION_SERVICE_URL:http://localhost:8092}
    timeout-ms: 5000
    api-key: ${PROJECTION_INTERNAL_API_KEY:}
    # Season the model projects, as a start year: 2026 is the 2026-27 season. Game-range
    # splits default to the season before it, since that is the one with games played.
    season: ${PROJECTION_SEASON:2026}
    model-version: ${PROJECTION_MODEL_VERSION:marcel-v2}

payments:
  # Subscription billing. Off by default (dark launch); enable per environment when going live.
  enabled: ${PAYMENTS_ENABLED:false}
  # Which provider implementation serves checkout/portal/webhooks: "mock" (in-repo test double,
  # the default) or a real provider added later. Selecting a provider is a config change only.
  provider: ${PAYMENTS_PROVIDER:mock}
  mock:
    # Secret the mock uses to sign its checkout/portal tokens and webhook payloads. No default
    # (env only); the mock flow fails when unset, like other secrets.
    webhook-secret: ${PAYMENTS_MOCK_WEBHOOK_SECRET:}
    # Base URL the mock uses to build its stub URLs and to self-POST the webhook. Locally the
    # BFF's own origin; on Coolify the bff service's Docker network alias.
    self-base-url: ${PAYMENTS_MOCK_SELF_BASE_URL:http://localhost:8080}

security:
  permitted-urls:
    - "/api/v1/auth/**"
    - "/api/v1/versions"
    - "/actuator/health"
  # Comma-separated allowlist of admin emails (e.g. ADMIN_EMAILS="me@x.com,you@y.com").
  # Logins by these addresses get an `admin` claim in their JWT (ROLE_ADMIN). Empty = no admins.
  admin-emails: ${ADMIN_EMAILS:}
  google:
    # Public OAuth Client ID for "Sign in with Google" (not a secret). When unset,
    # /api/v1/auth/google rejects all requests and the web hides the Google button.
    client-id: ${GOOGLE_CLIENT_ID:}
    # OAuth Client Secret (SECRET), used server-side to exchange the authorization code from
    # the top-level-redirect flow (/api/v1/auth/google/code). When unset that endpoint rejects
    # all requests; the embedded-button endpoint (/api/v1/auth/google) does not need it.
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Google's OAuth 2.0 token endpoint (non-secret; overridable for tests).
    token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    # Comma-separated allowlist of redirect URIs accepted for the code flow. Defaults to
    # <WEB_ORIGIN>/auth/google/callback so the common single-origin case needs no extra config;
    # set GOOGLE_REDIRECT_URIS to list several (e.g. apex + www) when needed. Each value must
    # also be registered as an authorized redirect URI on the Google OAuth client.
    allowed-redirect-uris: ${GOOGLE_REDIRECT_URIS:${WEB_ORIGIN:http://localhost:4200}/auth/google/callback}
  facebook:
    # Public Facebook App ID (not a secret) + the App Secret (secret), used server-side to
    # verify the user's access token via the Graph API. When either is unset,
    # /api/v1/auth/facebook rejects all requests and the web hides the Facebook button.
    app-id: ${FACEBOOK_APP_ID:}
    app-secret: ${FACEBOOK_APP_SECRET:}
    graph-base-url: ${FACEBOOK_GRAPH_BASE_URL:https://graph.facebook.com}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 2592000000  # 30 days
  rate-limit:
    # Per-client-IP limits on the public auth endpoints (brute-force / reset-email abuse).
    # Non-secret; disable with RATE_LIMIT_ENABLED=false. window-seconds = fixed window length.
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Protected endpoints (keyed by request path) and their per-IP limits.
    # Add or remove an endpoint here — no code change needed.
    endpoints:
      "/api/v1/auth/login": { limit: 10, window-seconds: 300 }
      "/api/v1/auth/register": { limit: 5, window-seconds: 3600 }
      "/api/v1/auth/google": { limit: 20, window-seconds: 300 }
      "/api/v1/auth/google/code": { limit: 20, window-seconds: 300 }
      "/api/v1/auth/facebook": { limit: 20, window-seconds: 300 }
      "/api/v1/auth/password/forgot": { limit: 5, window-seconds: 900 }
      "/api/v1/auth/password/reset": { limit: 10, window-seconds: 900 }
      "/api/v1/billing/checkout-session": { limit: 10, window-seconds: 300 }
      "/api/v1/billing/portal-session": { limit: 10, window-seconds: 300 }

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: fantasy-bff
    version: ${APP_VERSION:dev}
