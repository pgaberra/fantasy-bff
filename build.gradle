plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.openapi.generator' version '7.13.0'
}

group = 'com.fantasy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Configuration Properties Metadata
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// OpenAPI / Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.wiremock:wiremock-standalone:3.12.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// Only build the executable Spring Boot jar (skip the non-runnable "-plain" jar)
// so the Docker image can copy build/libs/*.jar unambiguously.
tasks.named('jar') {
	enabled = false
}

// Generate typed model classes from the committed db-service OpenAPI spec.
// Re-run after updating specs/fantasy-db-service-openapi.yaml.
openApiGenerate {
	generatorName = 'java'
	inputSpec = "${projectDir}/specs/fantasy-db-service-openapi.yaml".toString()
	outputDir = "${buildDir}/generated/openapi/db-service".toString()
	modelPackage = 'com.fantasy.bff.generated.db.model'
	// Restrict output to model POJOs — no API classes, supporting files, tests, or docs.
	globalProperties = [
		models: ''
	]
	generateApiTests = false
	generateModelTests = false
	generateApiDocumentation = false
	generateModelDocumentation = false
	configOptions = [
		openApiNullable: 'false',
		serializationLibrary: 'jackson',
		useJakartaEe: 'true',
	]
}

sourceSets {
	main {
		java {
			srcDir "${buildDir}/generated/openapi/db-service/src/main/java"
		}
	}
}

compileJava.dependsOn tasks.openApiGenerate
