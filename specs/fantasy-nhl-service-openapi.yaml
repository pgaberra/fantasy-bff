openapi: 3.1.0
info:
  title: Fantasy NHL Service API
  description: "Persisted, queryable mirror of the public NHL web API (rosters and\
    \ player stats) for the fantasy hockey tool."
  version: v1
servers:
- url: /
tags:
- name: Sync
  description: Trigger ingestion from the public NHL API
- name: Players
  description: NHL rosters and player stats (mirrors the NHL web API)
paths:
  /api/v1/sync:
    post:
      tags:
      - Sync
      summary: Trigger a full NHL data sync
      description: Fetches rosters and player stats from the NHL API and upserts them.
        Runs asynchronously and returns 202 immediately.
      operationId: triggerSync
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
        "409":
          description: A sync is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
  /api/v1/skater-stats-leaders/{season}/{gameType}:
    get:
      tags:
      - Players
      summary: All skaters with their stat line for a season
      description: Returns every skater (C/L/R/D) with full stats. Players with no
        recorded stats for the season (e.g. rookies) appear with null stat fields.
      operationId: skaterStatsLeaders
      parameters:
      - name: season
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: gameType
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Skaters returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkaterStatsLeadersResponse"
  /api/v1/roster/{teamAbbrev}/{season}:
    get:
      tags:
      - Players
      summary: A team's roster
      description: "Returns the stored roster for a team, grouped into forwards, defensemen\
        \ and goalies. The season path variable is accepted for NHL-API compatibility;\
        \ the service serves the most recently synced snapshot."
      operationId: roster
      parameters:
      - name: teamAbbrev
        in: path
        required: true
        schema:
          type: string
      - name: season
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Roster returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterResponse"
  /api/v1/goalie-stats-leaders/{season}/{gameType}:
    get:
      tags:
      - Players
      summary: All goalies with their stat line for a season
      description: Returns every goalie with full stats. Goalies with no recorded
        stats for the season appear with null stat fields.
      operationId: goalieStatsLeaders
      parameters:
      - name: season
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: gameType
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Goalies returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalieStatsLeadersResponse"
components:
  schemas:
    SyncAcceptedResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    SkaterStatsLeaderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        position:
          type: string
        sweaterNumber:
          type: integer
          format: int32
        teamAbbrev:
          type: string
        headshot:
          type: string
        gamesPlayed:
          type: integer
          format: int32
        goals:
          type: integer
          format: int32
        assists:
          type: integer
          format: int32
        points:
          type: integer
          format: int32
        plusMinus:
          type: integer
          format: int32
        pim:
          type: integer
          format: int32
        powerPlayGoals:
          type: integer
          format: int32
        powerPlayPoints:
          type: integer
          format: int32
        shorthandedGoals:
          type: integer
          format: int32
        shorthandedPoints:
          type: integer
          format: int32
        gameWinningGoals:
          type: integer
          format: int32
        otGoals:
          type: integer
          format: int32
        shots:
          type: integer
          format: int32
        shootingPctg:
          type: number
          format: double
        avgToi:
          type: string
        faceoffWinningPctg:
          type: number
          format: double
        hits:
          type: integer
          format: int32
        blockedShots:
          type: integer
          format: int32
        totalFaceoffWins:
          type: integer
          format: int32
        totalFaceoffLosses:
          type: integer
          format: int32
      required:
      - firstName
      - id
      - lastName
      - position
    SkaterStatsLeadersResponse:
      type: object
      properties:
        season:
          type: integer
          format: int32
        gameType:
          type: integer
          format: int32
        skaters:
          type: array
          items:
            $ref: "#/components/schemas/SkaterStatsLeaderResponse"
      required:
      - gameType
      - season
      - skaters
    RosterPlayerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        positionCode:
          type: string
        sweaterNumber:
          type: integer
          format: int32
        shootsCatches:
          type: string
        heightInInches:
          type: integer
          format: int32
        weightInPounds:
          type: integer
          format: int32
        birthDate:
          type: string
          format: date
        birthCountry:
          type: string
        headshot:
          type: string
      required:
      - firstName
      - id
      - lastName
      - positionCode
    RosterResponse:
      type: object
      properties:
        teamAbbrev:
          type: string
        forwards:
          type: array
          items:
            $ref: "#/components/schemas/RosterPlayerResponse"
        defensemen:
          type: array
          items:
            $ref: "#/components/schemas/RosterPlayerResponse"
        goalies:
          type: array
          items:
            $ref: "#/components/schemas/RosterPlayerResponse"
      required:
      - defensemen
      - forwards
      - goalies
      - teamAbbrev
    GoalieStatsLeaderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        position:
          type: string
        sweaterNumber:
          type: integer
          format: int32
        teamAbbrev:
          type: string
        headshot:
          type: string
        gamesPlayed:
          type: integer
          format: int32
        gamesStarted:
          type: integer
          format: int32
        wins:
          type: integer
          format: int32
        losses:
          type: integer
          format: int32
        otLosses:
          type: integer
          format: int32
        shutouts:
          type: integer
          format: int32
        shotsAgainst:
          type: integer
          format: int32
        saves:
          type: integer
          format: int32
        goalsAgainst:
          type: integer
          format: int32
        goalsAgainstAvg:
          type: number
          format: double
        savePctg:
          type: number
          format: double
      required:
      - firstName
      - id
      - lastName
      - position
    GoalieStatsLeadersResponse:
      type: object
      properties:
        season:
          type: integer
          format: int32
        gameType:
          type: integer
          format: int32
        goalies:
          type: array
          items:
            $ref: "#/components/schemas/GoalieStatsLeaderResponse"
      required:
      - gameType
      - goalies
      - season
