openapi: 3.1.0
info:
  title: Fantasy Yahoo Service API
  description: "Integrates with the Yahoo Fantasy Sports API: owns the per-user OAuth\
    \ 2.0 flow and exposes a user's fantasy league settings to the BFF."
  version: v1
servers:
- url: /
tags:
- name: Yahoo Players
  description: League-wide Yahoo player list with fantasy eligible positions (uses
    the app-owned service account)
- name: Players
  description: Cached player read model (identity + Yahoo eligible positions + season
    stats)
- name: Yahoo OAuth
  description: Per-user Yahoo account connection flow
- name: Sync
  description: Refresh the cached player read model from Yahoo
- name: Yahoo Leagues
  description: A user's Yahoo fantasy leagues and their settings
paths:
  /api/v1/yahoo/oauth/authorize-url:
    post:
      tags:
      - Yahoo OAuth
      summary: Build the Yahoo authorization URL
      description: Returns the Yahoo consent URL (with a signed state) the browser
        should be sent to.
      operationId: authorizeUrl
      parameters:
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Authorization URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeUrlResponse"
  /api/v1/sync:
    post:
      tags:
      - Sync
      summary: Trigger a player sync
      description: Refreshes the cached player read model from Yahoo. Runs asynchronously.
      operationId: triggerSync
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
        "409":
          description: A sync is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
  /api/v1/yahoo/players:
    get:
      tags:
      - Yahoo Players
      summary: List every Yahoo player for a game with eligible positions and season
        stats
      description: "Paginates the Yahoo game player collection using the service account\
        \ token, returning each player's identity, headshot, eligible positions and\
        \ the requested season's stat line. Defaults to the NHL game; a blank season\
        \ means the current season."
      operationId: players
      parameters:
      - name: gameKey
        in: query
        required: false
        schema:
          type: string
          default: nhl
      - name: season
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Players returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YahooPlayerResponse"
        "404":
          description: The Yahoo service account is not connected
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YahooPlayerResponse"
  /api/v1/yahoo/oauth/connection:
    get:
      tags:
      - Yahoo OAuth
      summary: Yahoo connection status
      description: Whether the given user has a connected Yahoo account.
      operationId: connection
      parameters:
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Connection status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
  /api/v1/yahoo/oauth/callback:
    get:
      tags:
      - Yahoo OAuth
      summary: Yahoo OAuth callback
      description: "Yahoo redirects the browser here after consent. Exchanges the\
        \ code for tokens, stores them, then redirects back to the web app. Public\
        \ (validated by the signed state), so it is exempt from the internal API-key\
        \ filter."
      operationId: callback
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        "302":
          description: Redirect back to the web app
  /api/v1/yahoo/leagues:
    get:
      tags:
      - Yahoo Leagues
      summary: List the user's NHL fantasy leagues
      operationId: leagues
      parameters:
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Leagues returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguesResponse"
        "404":
          description: User has not connected Yahoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguesResponse"
  /api/v1/yahoo/leagues/{leagueKey}/settings:
    get:
      tags:
      - Yahoo Leagues
      summary: Get a league's scoring + roster settings
      operationId: settings
      parameters:
      - name: leagueKey
        in: path
        required: true
        schema:
          type: string
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Settings returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSettingsResponse"
        "404":
          description: User has not connected Yahoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSettingsResponse"
  /api/v1/sync/runs:
    get:
      tags:
      - Sync
      summary: Recent sync runs
      description: Outcome (counts) and the diff (players added/removed) of the most
        recent syncs.
      operationId: runs
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: Runs returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncRunResponse"
  /api/v1/players/skaters:
    get:
      tags:
      - Players
      summary: All skaters with eligible positions and season stats
      operationId: skaters
      responses:
        "200":
          description: Skaters returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkaterResponse"
  /api/v1/players/goalies:
    get:
      tags:
      - Players
      summary: All goalies with eligible positions and season stats
      operationId: goalies
      responses:
        "200":
          description: Goalies returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalieResponse"
components:
  schemas:
    AuthorizeUrlResponse:
      type: object
      properties:
        authorizeUrl:
          type: string
          description: The Yahoo consent URL the browser should be redirected to.
      required:
      - authorizeUrl
    SyncAcceptedResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    YahooGoalieStats:
      type: object
      properties:
        gamesPlayed:
          type: integer
          format: int32
        gamesStarted:
          type: integer
          format: int32
        wins:
          type: integer
          format: int32
        losses:
          type: integer
          format: int32
        shutouts:
          type: integer
          format: int32
        shotsAgainst:
          type: integer
          format: int32
        saves:
          type: integer
          format: int32
        goalsAgainst:
          type: integer
          format: int32
        goalsAgainstAvg:
          type: number
          format: double
          description: Goals against average
        savePct:
          type: number
          format: double
          description: Save percentage as a fraction (e.g. 0.911)
    YahooPlayerResponse:
      type: object
      properties:
        yahooId:
          type: string
          description: Yahoo's player id
        fullName:
          type: string
          description: Player full name
        firstName:
          type: string
          description: Player first name
        lastName:
          type: string
          description: Player last name
        teamAbbrev:
          type: string
          description: Yahoo's editorial team abbreviation
        position:
          type: string
          description: "Primary position (single, e.g. \"C\")"
        uniformNumber:
          type: integer
          format: int32
          description: Uniform / sweater number
        imageUrl:
          type: string
          description: Full-resolution headshot image URL
        goalie:
          type: boolean
          description: Whether the player is a goalie
        eligiblePositions:
          type: array
          description: "Yahoo fantasy eligible positions (e.g. [\"C\",\"LW\"])"
          items:
            type: string
        skaterStats:
          $ref: "#/components/schemas/YahooSkaterStats"
          description: Season skater stat line; null for goalies
        goalieStats:
          $ref: "#/components/schemas/YahooGoalieStats"
          description: Season goalie stat line; null for skaters
      required:
      - eligiblePositions
      - firstName
      - fullName
      - goalie
      - lastName
      - yahooId
    YahooSkaterStats:
      type: object
      properties:
        gamesPlayed:
          type: integer
          format: int32
        goals:
          type: integer
          format: int32
        assists:
          type: integer
          format: int32
        points:
          type: integer
          format: int32
        plusMinus:
          type: integer
          format: int32
        pim:
          type: integer
          format: int32
        powerPlayGoals:
          type: integer
          format: int32
        powerPlayPoints:
          type: integer
          format: int32
        shorthandedGoals:
          type: integer
          format: int32
        shorthandedPoints:
          type: integer
          format: int32
        gameWinningGoals:
          type: integer
          format: int32
        shotsOnGoal:
          type: integer
          format: int32
        shootingPct:
          type: number
          format: double
          description: Shooting percentage as a fraction (e.g. 0.151)
        faceoffsWon:
          type: integer
          format: int32
        faceoffsLost:
          type: integer
          format: int32
        hits:
          type: integer
          format: int32
        blocks:
          type: integer
          format: int32
        avgTimeOnIce:
          type: string
          description: "Average time on ice per game, formatted \"MM:SS\""
    ConnectionResponse:
      type: object
      properties:
        connected:
          type: boolean
          description: Whether the user has a connected Yahoo account.
      required:
      - connected
    LeagueSummary:
      type: object
      properties:
        leagueKey:
          type: string
        name:
          type: string
        season:
          type: integer
          format: int32
        numTeams:
          type: integer
          format: int32
        scoringType:
          type: string
      required:
      - leagueKey
      - name
    LeaguesResponse:
      type: object
      properties:
        leagues:
          type: array
          items:
            $ref: "#/components/schemas/LeagueSummary"
      required:
      - leagues
    LeagueSettingsResponse:
      type: object
      properties:
        leagueKey:
          type: string
        name:
          type: string
        scoringType:
          type: string
        statCategories:
          type: array
          items:
            $ref: "#/components/schemas/StatCategory"
        rosterPositions:
          type: array
          items:
            $ref: "#/components/schemas/RosterSlot"
      required:
      - leagueKey
      - name
      - rosterPositions
      - scoringType
      - statCategories
    RosterSlot:
      type: object
      properties:
        position:
          type: string
        count:
          type: integer
          format: int32
        positionType:
          type: string
      required:
      - count
      - position
    StatCategory:
      type: object
      properties:
        statId:
          type: integer
          format: int32
        name:
          type: string
        displayName:
          type: string
        positionType:
          type: string
        displayOnly:
          type: boolean
          description: True when Yahoo marks the stat display-only (shown but not
            scored).
        pointValue:
          type: number
          format: double
      required:
      - displayOnly
      - name
      - statId
    SyncRunResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          type: string
        skaters:
          type: integer
          format: int32
        goalies:
          type: integer
          format: int32
        addedCount:
          type: integer
          format: int32
        removedCount:
          type: integer
          format: int32
        added:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string
        error:
          type: string
      required:
      - added
      - addedCount
      - id
      - removed
      - removedCount
      - startedAt
      - status
    SkaterResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        position:
          type: string
        eligiblePositions:
          type: array
          description: "Yahoo fantasy eligible positions (e.g. [\"C\",\"LW\"])"
          items:
            type: string
        sweaterNumber:
          type: integer
          format: int32
        teamAbbrev:
          type: string
        headshot:
          type: string
        gamesPlayed:
          type: integer
          format: int32
        goals:
          type: integer
          format: int32
        assists:
          type: integer
          format: int32
        points:
          type: integer
          format: int32
        plusMinus:
          type: integer
          format: int32
        pim:
          type: integer
          format: int32
        powerPlayGoals:
          type: integer
          format: int32
        powerPlayPoints:
          type: integer
          format: int32
        shorthandedGoals:
          type: integer
          format: int32
        shorthandedPoints:
          type: integer
          format: int32
        gameWinningGoals:
          type: integer
          format: int32
        shots:
          type: integer
          format: int32
        shootingPctg:
          type: number
          format: double
        avgToi:
          type: string
        faceoffWinningPctg:
          type: number
          format: double
        hits:
          type: integer
          format: int32
        blockedShots:
          type: integer
          format: int32
        totalFaceoffWins:
          type: integer
          format: int32
        totalFaceoffLosses:
          type: integer
          format: int32
      required:
      - eligiblePositions
      - firstName
      - id
      - lastName
      - position
    GoalieResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        position:
          type: string
        eligiblePositions:
          type: array
          description: "Yahoo fantasy eligible positions (e.g. [\"G\"])"
          items:
            type: string
        sweaterNumber:
          type: integer
          format: int32
        teamAbbrev:
          type: string
        headshot:
          type: string
        gamesPlayed:
          type: integer
          format: int32
        gamesStarted:
          type: integer
          format: int32
        wins:
          type: integer
          format: int32
        losses:
          type: integer
          format: int32
        shutouts:
          type: integer
          format: int32
        shotsAgainst:
          type: integer
          format: int32
        saves:
          type: integer
          format: int32
        goalsAgainst:
          type: integer
          format: int32
        goalsAgainstAvg:
          type: number
          format: double
        savePctg:
          type: number
          format: double
      required:
      - eligiblePositions
      - firstName
      - id
      - lastName
      - position
