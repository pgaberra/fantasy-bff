openapi: 3.1.0
info:
  title: Fantasy DB Service API
  description: User persistence API for the fantasy hockey tool.
  version: v1
servers:
- url: /
tags:
- name: User projections
  description: "Saved player projections, scoped to a user"
- name: Users
  description: User management
paths:
  /api/v1/users/{userId}/projections/{id}:
    get:
      tags:
      - User projections
      summary: "Fetch a single saved projection, including its data"
      operationId: get
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Projection found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No such projection for this user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
    put:
      tags:
      - User projections
      summary: Update an existing projection
      operationId: update
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectionRequest"
        required: true
      responses:
        "200":
          description: Projection updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed (blank name/data or too large)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No such projection for this user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: The user already has another projection with that name
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
    delete:
      tags:
      - User projections
      summary: Delete a saved projection
      operationId: delete
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Projection deleted
        "404":
          description: No such projection for this user
  /api/v1/users:
    get:
      tags:
      - Users
      summary: Look up a user by email address
      operationId: getByEmail
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: User found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: No user with that email
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    post:
      tags:
      - Users
      summary: Create a new user
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: User created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed (blank email / password hash)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          description: A user with that email already exists
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/{userId}/projections:
    get:
      tags:
      - User projections
      summary: "List a user's saved projections (metadata only, without the projection\
        \ data)"
      operationId: list
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "The user's projections, newest first"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectionSummaryResponse"
    post:
      tags:
      - User projections
      summary: Save a new projection for a user
      operationId: create_1
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectionRequest"
        required: true
      responses:
        "201":
          description: Projection created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed (blank name/data or too large)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: The user already has a projection with that name
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
  /api/v1/users/google:
    post:
      tags:
      - Users
      summary: Resolve the account for a verified Google identity
      description: "Returns the user linked to this Google subject, linking it to\
        \ an existing account with the same email or creating a new password-less\
        \ user."
      operationId: findOrCreateGoogleUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleUserRequest"
        required: true
      responses:
        "200":
          description: "User resolved (found, linked, or created)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed (blank email / subject)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/exists:
    get:
      tags:
      - Users
      summary: Check whether a user with the given email exists
      operationId: existsByEmail
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Always returns 200; check the 'exists' field
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExistsResponse"
components:
  schemas:
    PlayerProjection:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        type:
          type: string
          enum:
          - skater
          - goalie
        stats:
          $ref: "#/components/schemas/PlayerStats"
      required:
      - playerId
      - stats
      - type
    PlayerStats:
      type: object
      properties:
        utility:
          type: object
          additionalProperties:
            type: number
            format: double
        scoring:
          type: object
          additionalProperties:
            type: number
            format: double
      required:
      - scoring
      - utility
    ProjectionData:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/ProjectionSettings"
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerProjection"
      required:
      - players
      - settings
    ProjectionSettings:
      type: object
      properties:
        scoringType:
          type: string
          enum:
          - points
          - category
        statWeights:
          type: object
          additionalProperties:
            type: number
            format: double
        activeScoringColumns:
          type: array
          items:
            type: string
        activeUtilityColumns:
          type: array
          items:
            type: string
        scaleSettings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ScaleConfig"
        decimalSettings:
          type: object
          additionalProperties:
            type: integer
            format: int32
        useDefaultDecimals:
          type: boolean
        leagueSize:
          type: integer
          format: int32
          description: "Number of teams in the league; drives the category-league\
            \ ranking pool size. Only relevant for category leagues — points leagues\
            \ do not use it, so it is absent for them."
          maximum: 30
          minimum: 2
      required:
      - activeScoringColumns
      - activeUtilityColumns
      - decimalSettings
      - scaleSettings
      - scoringType
      - statWeights
      - useDefaultDecimals
    ScaleConfig:
      type: object
      properties:
        scale:
          type: boolean
        scalableStats:
          type: array
          items:
            type: string
      required:
      - scalableStats
      - scale
    UpdateProjectionRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        data:
          $ref: "#/components/schemas/ProjectionData"
      required:
      - data
      - name
    ProjectionResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        season:
          type: string
          enum:
          - "20252026"
          - "20262027"
          - "20272028"
          - "20282029"
        data:
          $ref: "#/components/schemas/ProjectionData"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - data
      - id
      - name
      - season
      - updatedAt
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        passwordHash:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - email
      - passwordHash
    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        passwordHash:
          type: string
          description: Null for users who only authenticate via Google
        googleSub:
          type: string
          description: Google subject id; null for password-only users
      required:
      - email
      - id
    CreateProjectionRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        data:
          $ref: "#/components/schemas/ProjectionData"
      required:
      - data
      - name
    GoogleUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        googleSub:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - email
      - googleSub
    ProjectionSummaryResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        season:
          type: string
          enum:
          - "20252026"
          - "20262027"
          - "20272028"
          - "20282029"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - id
      - name
      - season
      - updatedAt
    ExistsResponse:
      type: object
      properties:
        exists:
          type: boolean
      required:
      - exists
