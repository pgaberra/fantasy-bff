      - draftPicks
      - dryRun
      - playerRows
      - positionOverrides
      - projectionsScanned
      - sharedRows
      - sharesScanned
      - unmappedPlayerIds
    ProjectionSummaryResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - projection
          - preset_draft
          - imported
        preset:
          type: string
          description: "Which preset a preset draft was started from. Absent on any\
