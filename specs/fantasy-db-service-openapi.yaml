openapi: 3.1.0
info:
  title: Fantasy DB Service API
  description: User persistence API for the fantasy hockey tool.
  version: v1
servers:
- url: /
tags:
- name: Shared projections
  description: "Snapshot lookup by share token, for the BFF's public page"
- name: Email verification
  description: Single-use email-verification token issuance and consumption
- name: Password reset
  description: Single-use password reset token issuance and consumption
- name: Premium
  description: "Premium access: what a user is entitled to, and grants handed out\
    \ by an admin"
- name: Pending checkouts
  description: The one checkout a user has open with the payment provider
- name: User avatars
  description: The account's profile picture
- name: Subscriptions
  description: "A user's billing subscription, at most one per user"
- name: Projection imports
  description: Copying a shared board into a user's own projections
- name: Player ids
  description: "One-off: rewrite stored player ids from one platform's numbering to\
    \ another's"
- name: User projections
  description: "Saved player projections, scoped to a user"
- name: Users
  description: User management
- name: Projection shares
  description: The owner's control over a projection's public link
paths:
  /api/v1/users/{userId}/username:
    put:
      tags:
      - Users
      summary: Set the account's public name
      description: Nullable on the account until it is set; sharing a projection requires
        it.
      operationId: setUsername
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUsernameRequest"
        required: true
      responses:
        "200":
          description: Username set
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed (length or characters)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: No such user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          description: Another account already holds that name
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/{userId}/subscription:
    get:
      tags:
      - Subscriptions
      summary: Fetch a user's subscription
      operationId: get
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Subscription found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "404":
          description: The user has no subscription
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
    put:
      tags:
      - Subscriptions
      summary: Create or update a user's subscription (idempotent upsert from a provider
        event)
      operationId: upsert
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSubscriptionRequest"
        required: true
      responses:
        "200":
          description: Subscription created or updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "409":
          description: Concurrent create race for the same user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
  /api/v1/users/{userId}/projections/{projectionId}/share:
    get:
      tags:
      - Projection shares
      summary: "Fetch the projection's share, if it has one"
      operationId: get_1
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: projectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The projection is shared
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "404":
          description: "No such projection for this user, or it is not shared"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShareResponse"
    put:
      tags:
      - Projection shares
      summary: Publish or refresh the projection's public snapshot
      description: "Idempotent: an already-shared projection keeps its token, so links\
        \ already posted elsewhere stay valid and start showing the refreshed snapshot."
      operationId: share
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: projectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
        required: true
      responses:
        "200":
          description: "Share created, or the existing one returned"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "400":
          description: "Validation failed (too many rows, oversized name)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "409":
          description: The owner has not set a username yet
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "404":
          description: No such projection for this user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShareResponse"
  /api/v1/users/{userId}/projections/{id}:
    get:
      tags:
      - User projections
      summary: "Fetch a single saved projection, including its data"
      operationId: get_2
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Projection found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No such projection for this user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
    put:
      tags:
      - User projections
      summary: Update an existing projection
      operationId: update
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectionRequest"
        required: true
      responses:
        "200":
          description: Projection updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed (blank name/data or too large)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No such projection for this user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: The user already has another projection with that name
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
    delete:
      tags:
      - User projections
      summary: Delete a saved projection
      operationId: delete
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Projection deleted
        "404":
          description: No such projection for this user
  /api/v1/users/{userId}/pending-checkout:
    get:
      tags:
      - Pending checkouts
      summary: Fetch the checkout a user has open
      operationId: get_3
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Pending checkout found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PendingCheckoutResponse"
        "404":
          description: The user has no pending checkout
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PendingCheckoutResponse"
    put:
      tags:
      - Pending checkouts
      summary: "Store the user's open checkout, replacing the one the caller read\
        \ (compare-and-set)"
      operationId: replace
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplacePendingCheckoutRequest"
        required: true
      responses:
        "200":
          description: Pending checkout stored
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PendingCheckoutResponse"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PendingCheckoutResponse"
        "409":
          description: The stored checkout changed since the caller read it; read
            it again and use that one
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PendingCheckoutResponse"
  /api/v1/users/{userId}/avatar:
    get:
      tags:
      - User avatars
      summary: Fetch the account's profile picture
      operationId: getAvatar
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Avatar returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AvatarResponse"
        "404":
          description: "The account has no avatar, or there is no such user"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AvatarResponse"
    put:
      tags:
      - User avatars
      summary: Set the account's profile picture
      description: Replaces whatever the account had. The caller is trusted to have
        scaled the image and checked that it is what its content type says.
      operationId: setAvatar
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAvatarRequest"
        required: true
      responses:
        "200":
          description: Avatar set
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AvatarResponse"
        "400":
          description: "Validation failed (content type, or size)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AvatarResponse"
        "404":
          description: No such user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AvatarResponse"
    delete:
      tags:
      - User avatars
      summary: Remove the account's profile picture
      operationId: deleteAvatar
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Avatar removed
        "404":
          description: The account has no avatar
  /api/v1/users:
    get:
      tags:
      - Users
      summary: Look up a user by email address
      operationId: getByEmail
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: User found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: No user with that email
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    post:
      tags:
      - Users
      summary: Create a new user
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: User created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed (blank email / password hash)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          description: A user with that email already exists
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/{userId}/projections:
    get:
      tags:
      - User projections
      summary: "List a user's saved projections (metadata only, without the projection\
        \ data)"
      operationId: list
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "The user's projections, newest first"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectionSummaryResponse"
    post:
      tags:
      - User projections
      summary: Save a new projection for a user
      operationId: create_1
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectionRequest"
        required: true
      responses:
        "201":
          description: Projection created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed (blank name/data or too large)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: "The user already has a projection of that kind, or one with\
            \ that name"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
  /api/v1/users/{userId}/projections/imports:
    post:
      tags:
      - Projection imports
      summary: "Copy a shared projection into the user's own, by its share token"
      description: "Anyone holding the token may copy it. The copy is of the snapshot\
        \ as it was published, carries no draft, and is stamped with who shared it.\
        \ Copying the same board again is allowed: with no `name` given, a taken name\
        \ is resolved to \"<name> (2)\" rather than refused."
      operationId: importFromShare
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportProjectionRequest"
        required: true
      responses:
        "201":
          description: Projection imported
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed (blank or oversized token/name)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No share with that token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: The `name` given is already taken by another projection. Omit
            it and the server picks a free one.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
  /api/v1/users/{userId}/premium/grants:
    get:
      tags:
      - Premium
      summary: "Every premium grant a user has been given, newest first"
      operationId: grants
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Grants returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PremiumGrantResponse"
    post:
      tags:
      - Premium
      summary: "Give a user premium until a date, without a payment"
      operationId: grant
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantPremiumRequest"
        required: true
      responses:
        "201":
          description: Grant created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PremiumGrantResponse"
        "400":
          description: Validation failed (missing or past expiry)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PremiumGrantResponse"
        "404":
          description: No user with that id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PremiumGrantResponse"
    delete:
      tags:
      - Premium
      summary: End every grant the user still has
      description: "Marks them revoked rather than deleting them, so the audit trail\
        \ survives. A user with no active grant is left as they are."
      operationId: revokeGrants
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Any active grants were revoked
  /api/v1/users/password-reset:
    post:
      tags:
      - Password reset
      summary: Consume a password reset token and set the account's new password hash
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "204":
          description: Password updated
        "400":
          description: Validation failed (blank token / password hash)
        "404":
          description: "Token is invalid, expired, or already used"
  /api/v1/users/password-reset/tokens:
    post:
      tags:
      - Password reset
      summary: Issue a single-use password reset token for the account with this email
      description: "Returns 200 with a raw token when the email maps to a password\
        \ account. Returns 204 when no resettable account exists (unknown email, or\
        \ a Google-only password-less account). The caller must treat both outcomes\
        \ identically so that account existence is never revealed to end users."
      operationId: issueToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePasswordResetTokenRequest"
        required: true
      responses:
        "200":
          description: Token issued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PasswordResetTokenResponse"
        "204":
          description: No resettable account; nothing issued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PasswordResetTokenResponse"
        "400":
          description: Validation failed (blank/invalid email)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PasswordResetTokenResponse"
  /api/v1/users/google:
    post:
      tags:
      - Users
      summary: Resolve the account for a verified Google identity
      description: "Returns the user linked to this Google subject, linking it to\
        \ an existing account with the same email or creating a new password-less\
        \ user."
      operationId: findOrCreateGoogleUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleUserRequest"
        required: true
      responses:
        "200":
          description: "User resolved (found, linked, or created)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed (blank email / subject)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/facebook:
    post:
      tags:
      - Users
      summary: Resolve the account for a verified Facebook identity
      description: "Returns the user linked to this Facebook subject, linking it to\
        \ an existing account with the same email or creating a new password-less\
        \ user."
      operationId: findOrCreateFacebookUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacebookUserRequest"
        required: true
      responses:
        "200":
          description: "User resolved (found, linked, or created)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed (blank email / subject)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/email-verification:
    post:
      tags:
      - Email verification
      summary: Consume an email-verification token and mark the account's email verified
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "204":
          description: Email verified
        "400":
          description: Validation failed (blank token)
        "404":
          description: "Token is invalid, expired, or already used"
  /api/v1/users/email-verification/tokens:
    post:
      tags:
      - Email verification
      summary: Issue a single-use email-verification token for the account with this
        email
      description: "Returns 200 with a raw token when the email maps to an unverified\
        \ account. Returns 204 when there is nothing to verify (unknown email, or\
        \ an already-verified account). The caller must treat both outcomes identically\
        \ so that account existence is never revealed to end users."
      operationId: issueToken_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmailVerificationTokenRequest"
        required: true
      responses:
        "200":
          description: Token issued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmailVerificationTokenResponse"
        "204":
          description: Nothing to verify; nothing issued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmailVerificationTokenResponse"
        "400":
          description: Validation failed (blank/invalid email)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmailVerificationTokenResponse"
  /api/v1/admin/player-ids/remap:
    post:
      tags:
      - Player ids
      summary: Remap the player ids in saved projections and shares
      description: "Applies a crosswalk of old id → new id to every projection and\
        \ share still keyed by Yahoo's ids, and marks them as keyed by ESPN's. Ids\
        \ the crosswalk does not cover are left as they are, never dropped. Defaults\
        \ to a dry run: pass dryRun=false to actually write."
      operationId: remap
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerIdRemapRequest"
        required: true
      responses:
        "200":
          description: "Remap reported, and applied unless it was a dry run"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerIdRemapResponse"
        "400":
          description: "The crosswalk is empty, oversized, or maps one id two ways"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerIdRemapResponse"
  /api/v1/users/{userId}:
    get:
      tags:
      - Users
      summary: Fetch a user by id
      operationId: getById
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: User found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: No such user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/{userId}/premium:
    get:
      tags:
      - Premium
      summary: What premium access a user has right now
      description: "Resolves the user's subscription and any admin grant into one\
        \ answer. Always 200: a user with neither reads as no premium."
      operationId: entitlement
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Entitlement returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PremiumEntitlementResponse"
  /api/v1/users/exists:
    get:
      tags:
      - Users
      summary: Check whether a user with the given email exists
      operationId: existsByEmail
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Always returns 200; check the 'exists' field
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExistsResponse"
  /api/v1/shares/{token}:
    get:
      tags:
      - Shared projections
      summary: Fetch a shared snapshot by its token
      description: Carries no owner identity beyond their public username.
      operationId: get_4
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Snapshot found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SharedProjectionResponse"
        "404":
          description: No share with that token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SharedProjectionResponse"
  /api/v1/premium/customers:
    get:
      tags:
      - Premium
      summary: Everyone with premium access right now
      description: "Paying subscribers and users on an admin grant, newest account\
        \ first."
      operationId: customers
      responses:
        "200":
          description: Customers returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PremiumCustomerResponse"
components:
  schemas:
    SetUsernameRequest:
      type: object
      properties:
        username:
          type: string
          description: "Letters, digits and underscores, 3–20 characters. Shown publicly\
            \ wherever the account publishes something."
          maxLength: 20
          minLength: 3
          pattern: "^[A-Za-z0-9_]+$"
      required:
      - username
    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
          description: The account's public name; null until the user picks one
        passwordHash:
          type: string
          description: Null for users who only authenticate via a social provider
        googleSub:
          type: string
          description: Google subject id; null otherwise
        facebookSub:
          type: string
          description: Facebook subject id; null otherwise
        tokenVersion:
          type: integer
          format: int32
          description: Session-invalidation counter; the BFF stamps it into refresh
            tokens and rejects a refresh whose value is stale
        emailVerified:
          type: boolean
          description: Whether the account's email address has been verified
      required:
      - email
      - emailVerified
      - id
      - tokenVersion
    UpsertSubscriptionRequest:
      type: object
      properties:
        provider:
          type: string
          description: "Payment provider id, e.g. \"mock\" or \"stripe\""
          maxLength: 32
          minLength: 0
        providerCustomerId:
          type: string
          description: Provider-side customer id; null before the provider assigns
            one
          maxLength: 255
          minLength: 0
        providerSubscriptionId:
          type: string
          description: Provider-side subscription id; null before the provider assigns
            one
          maxLength: 255
          minLength: 0
        priceId:
          type: string
          description: Provider-side price/plan id; null if not applicable
          maxLength: 255
          minLength: 0
        status:
          type: string
          enum:
          - active
          - trialing
          - past_due
          - canceled
          - paused
          - unpaid
          - incomplete
        currentPeriodEnd:
          type: string
          format: date-time
          description: When the current paid period ends; null for open-ended or incomplete
            states
        cancelAtPeriodEnd:
          type: boolean
          description: Whether the subscription is set to cancel at period end
        eventAt:
          type: string
          format: date-time
          description: Provider event timestamp; an event older than the stored one
            is ignored
      required:
      - cancelAtPeriodEnd
      - eventAt
      - provider
      - status
    SubscriptionResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - active
          - trialing
          - past_due
          - canceled
          - paused
          - unpaid
          - incomplete
        currentPeriodEnd:
          type: string
          format: date-time
          description: When the current paid period ends; null for open-ended or incomplete
            states
        cancelAtPeriodEnd:
          type: boolean
          description: Whether the subscription is set to cancel at period end
        premium:
          type: boolean
          description: Whether the subscription currently grants premium access
        live:
          type: boolean
          description: "Whether the subscription can still bill or be resumed (active,\
            \ trialing, past_due, paused or unpaid). A user holds at most one live\
            \ subscription, so a caller must not start a new checkout while this is\
            \ true"
        provider:
          type: string
          description: Payment provider id
        providerCustomerId:
          type: string
          description: Provider-side customer id; null before the provider assigns
            one
      required:
      - cancelAtPeriodEnd
      - live
      - premium
      - provider
      - status
    CreateShareRequest:
      type: object
      properties:
        players:
          type: array
          description: "The ranked rows to publish, in display order. A share carries\
            \ the whole board so a signed-in visitor can read all of it; the cap is\
            \ a safety limit sized above the largest player pool, not the product\
            \ rule."
          items:
            $ref: "#/components/schemas/SharedPlayer"
          maxItems: 2000
          minItems: 0
      required:
      - players
    PlayerStats:
      type: object
      properties:
        utility:
          type: object
          additionalProperties:
            type: number
            format: double
        scoring:
          type: object
          additionalProperties:
            type: number
            format: double
      required:
      - scoring
      - utility
    SharedPlayer:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 100
          minLength: 0
        teamAbbrev:
          type: string
          description: "NHL team abbreviation, absent for a player without one."
          maxLength: 10
          minLength: 0
        headshot:
          type: string
          description: "Player headshot URL, copied at share time so the public page\
            \ needs no player read model. Absent for a player without one."
          maxLength: 300
          minLength: 0
        positions:
          type: array
          description: "Eligible positions, for skaters. Absent for goalies."
          items:
            type: string
            maxLength: 4
            minLength: 0
          maxItems: 6
          minItems: 0
        type:
          type: string
          enum:
          - skater
          - goalie
        rank:
          type: integer
          format: int32
          description: "Position in the shared ranking, 1-based."
          minimum: 1
        value:
          type: number
          format: double
          description: "The value the ranking was sorted by — fantasy points in a\
            \ points league, z-score in a category league."
        stats:
          $ref: "#/components/schemas/PlayerStats"
      required:
      - name
      - playerId
      - rank
      - stats
      - type
      - value
    ShareResponse:
      type: object
      properties:
        id:
          type: string
        projectionId:
          type: string
        token:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - id
      - projectionId
      - token
      - updatedAt
    DraftPick:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        teamId:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - playerId
      - teamId
    DraftState:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/DraftTeam"
          maxItems: 32
          minItems: 0
        order:
          type: array
          items:
            type: string
            maxLength: 64
            minLength: 0
          maxItems: 32
          minItems: 0
        picks:
          type: array
          items:
            $ref: "#/components/schemas/DraftPick"
        finishedAt:
          type: string
          format: date-time
          description: "When the manager marked this draft finished (ISO-8601, UTC).\
            \ Absent while the draft is still in progress."
      required:
      - order
      - picks
      - teams
    DraftTeam:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 0
        name:
          type: string
          maxLength: 64
          minLength: 0
        mine:
          type: boolean
      required:
      - id
      - mine
      - name
    EspnSync:
      type: object
      properties:
        leagueName:
          type: string
          maxLength: 200
          minLength: 0
        leagueId:
          type: string
          maxLength: 50
          minLength: 0
        syncedAt:
          type: string
          format: date-time
      required:
      - leagueId
      - leagueName
      - syncedAt
    PlayerProjection:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        type:
          type: string
          enum:
          - skater
          - goalie
        stats:
          $ref: "#/components/schemas/PlayerStats"
      required:
      - playerId
      - stats
      - type
    PositionOverride:
      type: object
      description: "Positions the owner set by hand for one skater, replacing the\
        \ ones the player read model reports."
      properties:
        playerId:
          type: integer
          format: int32
        positions:
          type: array
          items:
            type: string
            enum:
            - LW
            - C
            - RW
            - D
          maxItems: 4
          minItems: 0
      required:
      - playerId
      - positions
    ProjectionSettings:
      type: object
      properties:
        scoringType:
          type: string
          enum:
          - points
          - category
        statWeights:
          type: object
          additionalProperties:
            type: number
            format: double
        activeScoringColumns:
          type: array
          items:
            type: string
        activeUtilityColumns:
          type: array
          items:
            type: string
        scaleSettings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ScaleConfig"
        decimalSettings:
          type: object
          additionalProperties:
            type: integer
            format: int32
        useDefaultDecimals:
          type: boolean
        leagueSize:
          type: integer
          format: int32
          description: "Number of teams in the league; drives the category-league\
            \ ranking pool size. Only relevant for category leagues — points leagues\
            \ do not use it, so it is absent for them."
          maximum: 30
          minimum: 2
        rosterSlots:
          $ref: "#/components/schemas/RosterSlots"
          description: "Roster slots per team, used with leagueSize to size the category-league\
            \ ranking pool (pool = teams × slots). Bench (bn) and utility (util) count\
            \ as skater slots. Category leagues only — absent for points leagues."
        minGoalieGames:
          type: integer
          format: int32
          description: Minimum projected games a goalie must reach to qualify for
            category ranking; goalies below it are ranked last to avoid small-sample
            rate-stat inflation. Category leagues only — absent for points leagues.
          maximum: 82
          minimum: 0
        yahooSync:
          $ref: "#/components/schemas/YahooSync"
          description: Where these settings were last synced from — the Yahoo league
            name/key and the timestamp. Absent if the projection was never synced
            from a Yahoo league.
        espnSync:
          $ref: "#/components/schemas/EspnSync"
          description: Where these settings were last synced from — the ESPN league
            name/id and the timestamp. Absent if the projection was never synced from
            an ESPN league.
        lastEspnLeagueId:
          type: string
          description: "The last ESPN league this projection imported from, kept after\
            \ the settings stop being the league's so a re-import does not have to\
            \ be retyped. Outlives espnSync, which is cleared when the user takes\
            \ the projection out of sync."
          maxLength: 50
          minLength: 0
        playerBasis:
          type: string
          description: "What the player rows started from, and so what a player who\
            \ joins the pool later is seeded with: last season's stat line, or zeros.\
            \ Absent on projections saved before this was recorded."
          enum:
          - last_season
          - blank
        playerPoolSyncedAt:
          type: string
          format: date-time
          description: When the player rows were last reconciled against the player
            pool — the finish time of the sync run they were reconciled against. Absent
            until the rows have been reconciled once.
        unacknowledgedNewPlayerIds:
          type: array
          description: "Players a reconciliation with the player pool added whom the\
            \ owner has not acknowledged yet, kept so the app can go on saying so\
            \ until they do. Absent once acknowledged, and on a projection nothing\
            \ was ever added to. The cap matches the player list."
          items:
            type: integer
            format: int32
          maxItems: 2000
          minItems: 0
      required:
      - activeScoringColumns
      - activeUtilityColumns
      - decimalSettings
      - scaleSettings
      - scoringType
      - statWeights
      - useDefaultDecimals
    RosterSlots:
      type: object
      properties:
        c:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        lw:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        rw:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        d:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        util:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        bn:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        g:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
      required:
      - bn
      - c
      - d
      - g
      - lw
      - rw
      - util
    ScaleConfig:
      type: object
      properties:
        scale:
          type: boolean
        scalableStats:
          type: array
          items:
            type: string
      required:
      - scalableStats
      - scale
    UpdateProjectionData:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/ProjectionSettings"
        players:
          type: array
          description: "Omit to keep the stored player rows unchanged. Send them only\
            \ when they actually change, e.g. after editing a player's projected stats.\
            \ An empty list means the same as omitting them — a projection covers\
            \ every player, so there is no way to ask for none."
          items:
            $ref: "#/components/schemas/PlayerProjection"
        draft:
          $ref: "#/components/schemas/DraftState"
          description: In-draft state for this projection. Replaced on every update
            — omit it to clear.
        positionOverrides:
          type: array
          description: Positions the owner set by hand. Omit to keep the stored ones
            — a save that has nothing to do with positions must not clear them. Send
            an empty list to put every player back on the positions the read model
            reports.
          items:
            $ref: "#/components/schemas/PositionOverride"
          maxItems: 2000
          minItems: 0
      required:
      - settings
    UpdateProjectionRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        data:
          $ref: "#/components/schemas/UpdateProjectionData"
      required:
      - data
      - name
    YahooSync:
      type: object
      properties:
        leagueName:
          type: string
          maxLength: 200
          minLength: 0
        leagueKey:
          type: string
          maxLength: 100
          minLength: 0
        syncedAt:
          type: string
          format: date-time
      required:
      - leagueKey
      - leagueName
      - syncedAt
    ProjectionData:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/ProjectionSettings"
        players:
          type: array
          description: "One row per player the projection covers. The cap is a safety\
            \ limit sized above the largest player pool, not the product rule — a\
            \ full board is every player in the league."
          items:
            $ref: "#/components/schemas/PlayerProjection"
          maxItems: 2000
          minItems: 0
        draft:
          $ref: "#/components/schemas/DraftState"
          description: "In-draft state for this projection — the league's teams, the\
            \ snake draft order, and the picks made so far (each attributed to a team)\
            \ in pick order. Absent until a draft is configured."
        positionOverrides:
          type: array
          description: "Positions the owner set by hand, replacing what the player\
            \ read model reports for that skater. One entry per corrected player;\
            \ absent or empty means every player keeps its reported positions. The\
            \ cap matches the player list."
          items:
            $ref: "#/components/schemas/PositionOverride"
          maxItems: 2000
          minItems: 0
      required:
      - players
      - settings
    ProjectionOrigin:
      type: object
      properties:
        shareToken:
          type: string
          description: "The share the board was copied from. Still set once that share\
            \ is gone, so a stale token here is expected."
        authorUsername:
          type: string
          description: "The author's public name as it read at import time. Snapshotted\
            \ with the rows, unlike the live name on the public page."
      required:
      - authorUsername
      - shareToken
    ProjectionResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - projection
          - preset_draft
          - imported
        season:
          type: string
          enum:
          - "20252026"
          - "20262027"
          - "20272028"
          - "20282029"
        data:
          $ref: "#/components/schemas/ProjectionData"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        origin:
          $ref: "#/components/schemas/ProjectionOrigin"
          description: "Who the board was copied from, on an imported projection.\
            \ Absent on the user's own."
      required:
      - createdAt
      - data
      - id
      - kind
      - name
      - season
      - updatedAt
    ReplacePendingCheckoutRequest:
      type: object
      properties:
        provider:
          type: string
          description: Payment provider id
          maxLength: 32
          minLength: 0
        reference:
          type: string
          description: "The provider's id for the checkout, e.g. a Paddle transaction\
            \ id"
          maxLength: 255
          minLength: 0
        checkoutUrl:
          type: string
          description: Where the browser pays this checkout
          maxLength: 2048
          minLength: 0
        replacesReference:
          type: string
          description: "The reference of the checkout this one replaces, as the caller\
            \ last read it; omit for the user's first. The store is refused with 409\
            \ if the stored checkout is no longer that one"
          maxLength: 255
          minLength: 0
      required:
      - checkoutUrl
      - provider
      - reference
    PendingCheckoutResponse:
      type: object
      properties:
        provider:
          type: string
          description: Payment provider id
        reference:
          type: string
          description: "The provider's id for the checkout, e.g. a Paddle transaction\
            \ id"
        checkoutUrl:
          type: string
          description: Where the browser pays this checkout
        updatedAt:
          type: string
          format: date-time
          description: When this checkout was stored
      required:
      - checkoutUrl
      - provider
      - reference
      - updatedAt
    SetAvatarRequest:
      type: object
      properties:
        contentType:
          type: string
          description: "image/png, image/jpeg or image/webp: the type the bytes will\
            \ be served as"
          maxLength: 32
          minLength: 0
          pattern: ^image/(png|jpeg|webp)$
        data:
          type: string
          format: byte
          description: "The encoded image, already scaled to the size the app draws;\
            \ at most 512 KiB"
          maxLength: 524288
          minLength: 1
      required:
      - contentType
      - data
    AvatarResponse:
      type: object
      properties:
        contentType:
          type: string
        data:
          type: string
          format: byte
        updatedAt:
          type: string
          format: date-time
      required:
      - contentType
      - data
      - updatedAt
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        passwordHash:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - email
      - passwordHash
    CreateProjectionRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        kind:
          type: string
          description: What the projection is for. Defaults to the user's own.
          enum:
          - projection
          - preset_draft
          - imported
        preset:
          type: string
          description: Which preset a preset draft was started from. A user may hold
            one draft per preset. Ignored on any other kind.
          enum:
          - last_season
          - model
        data:
          $ref: "#/components/schemas/ProjectionData"
        playerIdSpace:
          type: string
          description: "Which platform's player ids the rows are keyed by. Required\
            \ rather than defaulted: a wrong value here is silent until a remap translates\
            \ ids that were never in the space it assumed."
          enum:
          - yahoo
          - espn
      required:
      - data
      - name
      - playerIdSpace
    ImportProjectionRequest:
      type: object
      properties:
        token:
          type: string
          description: The share link's token.
          maxLength: 64
          minLength: 0
        name:
          type: string
          description: What to call the copy. Defaults to the name it was shared under.
          maxLength: 100
          minLength: 0
      required:
      - token
    GrantPremiumRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          description: When the grant stops giving premium access; must be in the
            future
        grantedBy:
          type: string
          description: "Who handed the grant out, for the audit trail (the admin's\
            \ email)"
          maxLength: 255
          minLength: 0
        reason:
          type: string
          description: Free-text note on why premium was given
          maxLength: 255
          minLength: 0
      required:
      - expiresAt
      - grantedBy
    PremiumGrantResponse:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        startsAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          description: When the grant was revoked; null while it still stands
        grantedBy:
          type: string
        reason:
          type: string
          description: Free-text note on why premium was given
        active:
          type: boolean
          description: Whether the grant gives premium access right now
        createdAt:
          type: string
          format: date-time
      required:
      - active
      - createdAt
      - expiresAt
      - grantedBy
      - id
      - startsAt
      - userId
    PasswordResetRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 128
          minLength: 0
        passwordHash:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - passwordHash
      - token
    CreatePasswordResetTokenRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
      required:
      - email
    PasswordResetTokenResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - expiresAt
      - token
    GoogleUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        googleSub:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - email
      - googleSub
    FacebookUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        facebookSub:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - email
      - facebookSub
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - token
    CreateEmailVerificationTokenRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
      required:
      - email
    EmailVerificationTokenResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - expiresAt
      - token
    PlayerIdPair:
      type: object
      properties:
        from:
          type: integer
          format: int32
          description: The stored id
          minimum: 1
        to:
          type: integer
          format: int32
          description: The id to store instead
          minimum: 1
      required:
      - from
      - to
    PlayerIdRemapRequest:
      type: object
      properties:
        mappings:
          type: array
          description: "Old id → new id, one entry per player. Ids not listed are\
            \ left exactly as they are."
          items:
            $ref: "#/components/schemas/PlayerIdPair"
          maxItems: 5000
          minItems: 0
        dryRun:
          type: boolean
          description: "Report what would change and write nothing. Defaults to true,\
            \ so an unqualified call cannot rewrite anyone's projection."
      required:
      - mappings
    PlayerIdRemapCounts:
      type: object
      properties:
        remapped:
          type: integer
          format: int32
        unmapped:
          type: integer
          format: int32
      required:
      - remapped
      - unmapped
    PlayerIdRemapResponse:
      type: object
      properties:
        dryRun:
          type: boolean
          description: Nothing was written
        projectionsScanned:
          type: integer
          format: int32
        playerRows:
          $ref: "#/components/schemas/PlayerIdRemapCounts"
        draftPicks:
          $ref: "#/components/schemas/PlayerIdRemapCounts"
        positionOverrides:
          $ref: "#/components/schemas/PlayerIdRemapCounts"
          description: The positions an owner corrected by hand; an unmapped one stops
            reaching the player it was written for
        sharesScanned:
          type: integer
          format: int32
        sharedRows:
          $ref: "#/components/schemas/PlayerIdRemapCounts"
          description: The rows a share published — what its public page shows and
            what an import copies
        unmappedPlayerIds:
          type: array
          description: "Distinct stored ids the crosswalk had no entry for, at most\
            \ 50 of them"
          items:
            type: integer
            format: int32
