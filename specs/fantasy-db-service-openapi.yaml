openapi: 3.1.0
info:
  title: Fantasy DB Service API
  description: User persistence API for the fantasy hockey tool.
  version: v1
servers:
- url: /
tags:
- name: Password reset
  description: Single-use password reset token issuance and consumption
- name: User projections
  description: "Saved player projections, scoped to a user"
- name: Users
  description: User management
paths:
  /api/v1/users/{userId}/projections/{id}:
    get:
      tags:
      - User projections
      summary: "Fetch a single saved projection, including its data"
      operationId: get
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Projection found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No such projection for this user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
    put:
      tags:
      - User projections
      summary: Update an existing projection
      operationId: update
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectionRequest"
        required: true
      responses:
        "200":
          description: Projection updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed (blank name/data or too large)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No such projection for this user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: The user already has another projection with that name
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
    delete:
      tags:
      - User projections
      summary: Delete a saved projection
      operationId: delete
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Projection deleted
        "404":
          description: No such projection for this user
  /api/v1/users:
    get:
      tags:
      - Users
      summary: Look up a user by email address
      operationId: getByEmail
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: User found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: No user with that email
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    post:
      tags:
      - Users
      summary: Create a new user
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: User created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed (blank email / password hash)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          description: A user with that email already exists
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/{userId}/projections:
    get:
      tags:
      - User projections
      summary: "List a user's saved projections (metadata only, without the projection\
        \ data)"
      operationId: list
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "The user's projections, newest first"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectionSummaryResponse"
    post:
      tags:
      - User projections
      summary: Save a new projection for a user
      operationId: create_1
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectionRequest"
        required: true
      responses:
        "201":
          description: Projection created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed (blank name/data or too large)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: The user already has a projection with that name
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
  /api/v1/users/password-reset:
    post:
      tags:
      - Password reset
      summary: Consume a password reset token and set the account's new password hash
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "204":
          description: Password updated
        "400":
          description: Validation failed (blank token / password hash)
        "404":
          description: "Token is invalid, expired, or already used"
  /api/v1/users/password-reset/tokens:
    post:
      tags:
      - Password reset
      summary: Issue a single-use password reset token for the account with this email
      description: "Returns 200 with a raw token when the email maps to a password\
        \ account. Returns 204 when no resettable account exists (unknown email, or\
        \ a Google-only password-less account). The caller must treat both outcomes\
        \ identically so that account existence is never revealed to end users."
      operationId: issueToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePasswordResetTokenRequest"
        required: true
      responses:
        "200":
          description: Token issued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PasswordResetTokenResponse"
        "204":
          description: No resettable account; nothing issued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PasswordResetTokenResponse"
        "400":
          description: Validation failed (blank/invalid email)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PasswordResetTokenResponse"
  /api/v1/users/google:
    post:
      tags:
      - Users
      summary: Resolve the account for a verified Google identity
      description: "Returns the user linked to this Google subject, linking it to\
        \ an existing account with the same email or creating a new password-less\
        \ user."
      operationId: findOrCreateGoogleUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleUserRequest"
        required: true
      responses:
        "200":
          description: "User resolved (found, linked, or created)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed (blank email / subject)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/facebook:
    post:
      tags:
      - Users
      summary: Resolve the account for a verified Facebook identity
      description: "Returns the user linked to this Facebook subject, linking it to\
        \ an existing account with the same email or creating a new password-less\
        \ user."
      operationId: findOrCreateFacebookUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacebookUserRequest"
        required: true
      responses:
        "200":
          description: "User resolved (found, linked, or created)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed (blank email / subject)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/exists:
    get:
      tags:
      - Users
      summary: Check whether a user with the given email exists
      operationId: existsByEmail
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Always returns 200; check the 'exists' field
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExistsResponse"
components:
  schemas:
    DraftPick:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        teamId:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - playerId
      - teamId
    DraftState:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/DraftTeam"
          maxItems: 32
          minItems: 0
        order:
          type: array
          items:
            type: string
            maxLength: 64
            minLength: 0
          maxItems: 32
          minItems: 0
        picks:
          type: array
          items:
            $ref: "#/components/schemas/DraftPick"
      required:
      - order
      - picks
      - teams
    DraftTeam:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 0
        name:
          type: string
          maxLength: 64
          minLength: 0
        mine:
          type: boolean
      required:
      - id
      - mine
      - name
    PlayerProjection:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        type:
          type: string
          enum:
          - skater
          - goalie
        stats:
          $ref: "#/components/schemas/PlayerStats"
      required:
      - playerId
      - stats
      - type
    PlayerStats:
      type: object
      properties:
        utility:
          type: object
          additionalProperties:
            type: number
            format: double
        scoring:
          type: object
          additionalProperties:
            type: number
            format: double
      required:
      - scoring
      - utility
    ProjectionData:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/ProjectionSettings"
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerProjection"
        draft:
          $ref: "#/components/schemas/DraftState"
          description: "In-draft state for this projection — the league's teams, the\
            \ snake draft order, and the picks made so far (each attributed to a team)\
            \ in pick order. Absent until a draft is configured."
      required:
      - players
      - settings
    ProjectionSettings:
      type: object
      properties:
        scoringType:
          type: string
          enum:
          - points
          - category
        statWeights:
          type: object
          additionalProperties:
            type: number
            format: double
        activeScoringColumns:
          type: array
          items:
            type: string
        activeUtilityColumns:
          type: array
          items:
            type: string
        scaleSettings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ScaleConfig"
        decimalSettings:
          type: object
          additionalProperties:
            type: integer
            format: int32
        useDefaultDecimals:
          type: boolean
        leagueSize:
          type: integer
          format: int32
          description: "Number of teams in the league; drives the category-league\
            \ ranking pool size. Only relevant for category leagues — points leagues\
            \ do not use it, so it is absent for them."
          maximum: 30
          minimum: 2
        rosterSlots:
          $ref: "#/components/schemas/RosterSlots"
          description: "Roster slots per team, used with leagueSize to size the category-league\
            \ ranking pool (pool = teams × slots). Bench (bn) and utility (util) count\
            \ as skater slots. Category leagues only — absent for points leagues."
        minGoalieGames:
          type: integer
          format: int32
          description: Minimum projected games a goalie must reach to qualify for
            category ranking; goalies below it are ranked last to avoid small-sample
            rate-stat inflation. Category leagues only — absent for points leagues.
          maximum: 82
          minimum: 0
        yahooSync:
          $ref: "#/components/schemas/YahooSync"
          description: Where these settings were last synced from — the Yahoo league
            name/key and the timestamp. Absent if the projection was never synced
            from a Yahoo league.
      required:
      - activeScoringColumns
      - activeUtilityColumns
      - decimalSettings
      - scaleSettings
      - scoringType
      - statWeights
      - useDefaultDecimals
    RosterSlots:
      type: object
      properties:
        c:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        lw:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        rw:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        d:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        util:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        bn:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        g:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
      required:
      - bn
      - c
      - d
      - g
      - lw
      - rw
      - util
    ScaleConfig:
      type: object
      properties:
        scale:
          type: boolean
        scalableStats:
          type: array
          items:
            type: string
      required:
      - scalableStats
      - scale
    UpdateProjectionRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        data:
          $ref: "#/components/schemas/ProjectionData"
      required:
      - data
      - name
    YahooSync:
      type: object
      properties:
        leagueName:
          type: string
          maxLength: 200
          minLength: 0
        leagueKey:
          type: string
          maxLength: 100
          minLength: 0
        syncedAt:
          type: string
          format: date-time
      required:
      - leagueKey
      - leagueName
      - syncedAt
    ProjectionResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        season:
          type: string
          enum:
          - "20252026"
          - "20262027"
          - "20272028"
          - "20282029"
        data:
          $ref: "#/components/schemas/ProjectionData"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - data
      - id
      - name
      - season
      - updatedAt
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        passwordHash:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - email
      - passwordHash
    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        passwordHash:
          type: string
          description: Null for users who only authenticate via a social provider
        googleSub:
          type: string
          description: Google subject id; null otherwise
        facebookSub:
          type: string
          description: Facebook subject id; null otherwise
      required:
      - email
      - id
    CreateProjectionRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        data:
          $ref: "#/components/schemas/ProjectionData"
      required:
      - data
      - name
    PasswordResetRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 128
          minLength: 0
        passwordHash:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - passwordHash
      - token
    CreatePasswordResetTokenRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
      required:
      - email
    PasswordResetTokenResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - expiresAt
      - token
    GoogleUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        googleSub:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - email
      - googleSub
    FacebookUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        facebookSub:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - email
      - facebookSub
    ProjectionSummaryResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        season:
          type: string
          enum:
          - "20252026"
          - "20262027"
          - "20272028"
          - "20282029"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - id
      - name
      - season
      - updatedAt
    ExistsResponse:
      type: object
      properties:
        exists:
          type: boolean
      required:
      - exists
