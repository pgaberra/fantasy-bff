openapi: 3.0.3
info:
  title: Fantasy DB Service API
  version: 1.0.0
  description: |
    User management API for the fantasy hockey application.
    Owned by fantasy-db-service; update this file when the db-service API changes,
    then run `./gradlew openApiGenerate` (or just `./gradlew build`) to regenerate
    the client models in com.fantasy.bff.generated.db.model.

servers:
  - url: http://localhost:8086
    description: Local development

tags:
  - name: Users
    description: User management

paths:
  /api/v1/users:
    get:
      tags: [Users]
      summary: Look up a user by email address
      operationId: getByEmail
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: No user with that email

    post:
      tags: [Users]
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation failed (blank email / password hash)
        '409':
          description: A user with that email already exists

  /api/v1/users/exists:
    get:
      tags: [Users]
      summary: Check whether a user with the given email exists
      operationId: existsByEmail
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Always returns 200; check the exists field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExistsResponse'

components:
  schemas:
    UserResponse:
      type: object
      required:
        - id
        - email
        - passwordHash
      properties:
        id:
          type: string
          description: UUID of the user
        email:
          type: string
          description: User's email address
        passwordHash:
          type: string
          description: BCrypt hash of the user's password

    ExistsResponse:
      type: object
      required:
        - exists
      properties:
        exists:
          type: boolean
          description: Whether a user with the queried email exists

    CreateUserRequest:
      type: object
      required:
        - email
        - passwordHash
      properties:
        email:
          type: string
          format: email
          description: User's email address
        passwordHash:
          type: string
          description: BCrypt hash of the user's password
