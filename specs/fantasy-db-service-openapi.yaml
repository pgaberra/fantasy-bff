          - last_season
          - model
        season:
          type: string
          enum:
          - "20252026"
          - "20262027"
          - "20272028"
          - "20282029"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        draftStatus:
          type: string
          enum:
          - none
          - in_progress
          - finished
        origin:
          $ref: "#/components/schemas/ProjectionOrigin"
          description: "Who the board was copied from, on an imported projection.\
            \ Absent on the user's own."
      required:
      - createdAt
      - draftStatus
      - id
      - kind
      - name
      - season
      - updatedAt
    PremiumEntitlementResponse:
      type: object
      properties:
        premium:
          type: boolean
          description: "Whether the user has premium access right now, paid for or\
            \ granted"
        source:
          type: string
          description: "What premium access rests on: a subscription, an admin grant,\
            \ or both"
          enum:
          - none
          - subscription
          - grant
          - both
        subscriptionStatus:
          type: string
          description: Subscription status; null when the user has no subscription
          enum:
          - active
          - trialing
          - past_due
          - canceled
          - paused
          - unpaid
          - incomplete
        currentPeriodEnd:
          type: string
          format: date-time
          description: When the current paid period ends; null when not applicable
        cancelAtPeriodEnd:
          type: boolean
          description: Whether the subscription is set to cancel at period end
        grantExpiresAt:
          type: string
          format: date-time
          description: When the admin grant runs out; null when there is no active
            grant
        premiumUntil:
          type: string
          format: date-time
          description: When premium runs out altogether; null when it is open-ended
      required:
      - cancelAtPeriodEnd
      - premium
      - source
    ExistsResponse:
      type: object
      properties:
        exists:
          type: boolean
      required:
      - exists
    SharedProjectionData:
