openapi: 3.1.0
info:
  title: Fantasy ESPN Service API
  description: "Integrates with the ESPN Fantasy v3 API: reads a user's fantasy hockey\
    \ league settings (and stores the espn_s2 / SWID cookies needed for private leagues)\
    \ for the BFF."
  version: v1
servers:
- url: /
tags:
- name: ESPN Players
  description: "Cached player read model: the pool as ESPN lists it now, with a chosen\
    \ season's stats"
- name: ESPN Leagues
  description: A user's ESPN fantasy hockey league settings and teams
- name: ESPN Credentials
  description: "A user's stored ESPN cookies (espn_s2 + SWID), needed to read private\
    \ leagues"
paths:
  /api/v1/espn/credentials:
    get:
      tags:
      - ESPN Credentials
      summary: Whether the user has stored ESPN cookies
      operationId: status
      parameters:
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialStatusResponse"
    put:
      tags:
      - ESPN Credentials
      summary: Store (or replace) the user's ESPN cookies
      operationId: save
      parameters:
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCredentialsRequest"
        required: true
      responses:
        "204":
          description: Cookies stored
        "400":
          description: Missing or invalid cookie values
    delete:
      tags:
      - ESPN Credentials
      summary: Delete the user's stored ESPN cookies
      operationId: delete
      parameters:
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Cookies deleted (or none existed)
  /api/v1/espn/players/sync:
    post:
      tags:
      - ESPN Players
      summary: Refresh the cached player read model from ESPN
      description: "Runs asynchronously and answers as soon as it is under way: the\
        \ whole player universe is fetched, parsed and checked against the image CDN,\
        \ which takes minutes. Watch it with GET /api/v1/espn/players/sync/latest\
        \ until running is false and syncedAt has moved."
      operationId: sync
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
        "409":
          description: A sync is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
  /api/v1/espn/players:
    get:
      tags:
      - ESPN Players
      summary: "Reference-season stat lines for the stats Yahoo does not report (hat\
        \ tricks, shifts, goalie OT losses, time on ice)"
      operationId: players
      responses:
        "200":
          description: Stat lines returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStatsResponse"
  /api/v1/espn/players/sync/latest:
    get:
      tags:
      - ESPN Players
      summary: "When the cached pool was last refreshed, and how many players it holds"
      description: "For callers that only need to know whether the pool has moved,\
        \ so they do not have to fetch the pool to find out."
      operationId: lastSync
      responses:
        "200":
          description: Sync status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSyncStatusResponse"
  /api/v1/espn/players/skaters:
    get:
      tags:
      - ESPN Players
      summary: All skaters with eligible positions and a season's stats
      operationId: skaters
      parameters:
      - name: season
        in: query
        description: "Season start year — 2025 is the 2025-26 season. Required: the\
          \ season being collected and the season a caller wants to show are deliberately\
          \ different for most of the year, so there is no sensible default. A player\
          \ with no line for it comes back with no stats rather than being left out."
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Skaters returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkaterResponse"
  /api/v1/espn/players/goalies:
    get:
      tags:
      - ESPN Players
      summary: All goalies with eligible positions and a season's stats
      operationId: goalies
      parameters:
      - name: season
        in: query
        description: "Season start year — 2025 is the 2025-26 season. Required: the\
          \ season being collected and the season a caller wants to show are deliberately\
          \ different for most of the year, so there is no sensible default. A player\
          \ with no line for it comes back with no stats rather than being left out."
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Goalies returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalieResponse"
  /api/v1/espn/leagues/{leagueId}/teams:
    get:
      tags:
      - ESPN Leagues
      summary: List a league's teams (names + which is the user's own)
      operationId: teams
      parameters:
      - name: leagueId
        in: path
        required: true
        schema:
          type: string
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      - name: season
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Teams returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueTeamsResponse"
        "400":
          description: League is private (cookies missing/invalid) or the league id/season
            is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueTeamsResponse"
        "404":
          description: No such ESPN league for the id and season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueTeamsResponse"
  /api/v1/espn/leagues/{leagueId}/settings:
    get:
      tags:
      - ESPN Leagues
      summary: Get a league's scoring + roster settings
      operationId: settings
      parameters:
      - name: leagueId
        in: path
        required: true
        schema:
          type: string
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      - name: season
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Settings returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSettingsResponse"
        "400":
          description: League is private (cookies missing/invalid) or the league id/season
            is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSettingsResponse"
        "404":
          description: No such ESPN league for the id and season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSettingsResponse"
  /api/v1/espn/credentials/values:
    get:
      tags:
      - ESPN Credentials
      summary: The user's stored ESPN cookies themselves
      description: For showing a user their own saved connection. 404 when none are
        stored.
      operationId: values
      parameters:
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Cookies returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialValuesResponse"
        "404":
          description: User has no stored cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialValuesResponse"
components:
  schemas:
    SaveCredentialsRequest:
      type: object
      properties:
        espnS2:
          type: string
          description: The user's espn_s2 cookie value.
          maxLength: 1024
          minLength: 0
        swid:
          type: string
          description: The user's SWID cookie value (including the braces).
          maxLength: 128
          minLength: 0
      required:
      - espnS2
      - swid
    SyncAcceptedResponse:
      type: object
      properties:
        status:
          type: string
          description: "started, or running when one was already under way"
      required:
      - status
    PlayerStatLine:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ESPN's player id
        fullName:
          type: string
        position:
          type: string
          description: "C, LW, RW, D or G"
        sweaterNumber:
          type: integer
          format: int32
          description: "Jersey number, which is what separates two players who share\
            \ a name"
        gamesPlayed:
          type: integer
          format: int32
        hatTricks:
          type: integer
          format: int32
        shifts:
          type: integer
          format: int32
        overtimeLosses:
          type: integer
          format: int32
          description: Goalie overtime losses
        timeOnIce:
          type: integer
          format: int32
          description: "Total time on ice for the season, in seconds"
      required:
      - fullName
      - id
      - position
    PlayerStatsResponse:
      type: object
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerStatLine"
        syncedAt:
          type: string
          format: date-time
          description: When the cached stat lines were last refreshed from ESPN; absent
            while no sync has succeeded yet
      required:
      - players
    PlayerSyncStatusResponse:
      type: object
      properties:
        syncedAt:
          type: string
          format: date-time
          description: When the pool was last refreshed from ESPN; absent while no
            sync has succeeded yet
        players:
          type: integer
          format: int64
          description: Players stored
        running:
          type: boolean
          description: Whether a sync is running right now. A triggered sync is watched
            by polling this until it is false and syncedAt has moved.
      required:
      - players
      - running
    SkaterResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ESPN's player id
        firstName:
          type: string
        lastName:
          type: string
        position:
          type: string
        eligiblePositions:
          type: array
          description: "ESPN fantasy eligible positions (e.g. [\"C\",\"LW\"])"
          items:
            type: string
        sweaterNumber:
          type: integer
          format: int32
        teamAbbrev:
          type: string
        headshot:
          type: string
          description: "ESPN image CDN URL for the player's headshot, already sized\
            \ for the player table"
        gamesPlayed:
          type: integer
          format: int32
        goals:
          type: integer
          format: int32
        assists:
          type: integer
          format: int32
        points:
          type: integer
          format: int32
        plusMinus:
          type: integer
          format: int32
        pim:
          type: integer
          format: int32
        powerPlayGoals:
          type: integer
          format: int32
        powerPlayPoints:
          type: integer
          format: int32
        shorthandedGoals:
          type: integer
          format: int32
        shorthandedPoints:
          type: integer
          format: int32
        gameWinningGoals:
          type: integer
          format: int32
        shots:
          type: integer
          format: int32
        shootingPctg:
          type: number
          format: double
        avgToi:
          type: string
        faceoffWinningPctg:
          type: number
          format: double
        hits:
          type: integer
          format: int32
        blockedShots:
          type: integer
          format: int32
        totalFaceoffWins:
          type: integer
          format: int32
        totalFaceoffLosses:
          type: integer
          format: int32
        hatTricks:
          type: integer
          format: int32
          description: Stats Yahoo does not report at all
        shifts:
          type: integer
          format: int32
        timeOnIce:
          type: integer
          format: int32
          description: "Total time on ice for the season, in seconds"
      required:
      - eligiblePositions
      - firstName
      - id
      - lastName
      - position
    GoalieResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ESPN's player id
        firstName:
          type: string
        lastName:
          type: string
        position:
          type: string
        eligiblePositions:
          type: array
          description: "ESPN fantasy eligible positions (e.g. [\"G\"])"
          items:
            type: string
        sweaterNumber:
          type: integer
          format: int32
        teamAbbrev:
          type: string
        headshot:
          type: string
          description: "ESPN image CDN URL for the player's headshot, already sized\
            \ for the player table"
        gamesPlayed:
          type: integer
          format: int32
        gamesStarted:
          type: integer
          format: int32
        wins:
          type: integer
          format: int32
        losses:
          type: integer
          format: int32
        shutouts:
          type: integer
          format: int32
        shotsAgainst:
          type: integer
          format: int32
        saves:
          type: integer
          format: int32
        goalsAgainst:
          type: integer
          format: int32
        goalsAgainstAvg:
          type: number
          format: double
        savePctg:
          type: number
          format: double
        overtimeLosses:
          type: integer
          format: int32
          description: Stats Yahoo does not report at all
        timeOnIce:
          type: integer
          format: int32
          description: "Total time on ice for the season, in seconds"
      required:
      - eligiblePositions
      - firstName
      - id
      - lastName
      - position
    LeagueTeam:
      type: object
      properties:
        name:
          type: string
        mine:
          type: boolean
          description: True for the authenticated user's own team (matched via their
            SWID; always false for public leagues read without cookies).
      required:
      - mine
      - name
    LeagueTeamsResponse:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/LeagueTeam"
      required:
      - teams
    LeagueSettingsResponse:
      type: object
      properties:
        leagueId:
          type: string
        name:
          type: string
        scoringType:
          type: string
          description: "ESPN scoring type, e.g. H2H_POINTS, H2H_CATEGORY, ROTO."
        size:
          type: integer
          format: int32
          description: Number of teams in the league.
        statCategories:
          type: array
          items:
            $ref: "#/components/schemas/StatCategory"
        rosterPositions:
          type: array
          items:
            $ref: "#/components/schemas/RosterSlot"
      required:
      - leagueId
      - rosterPositions
      - statCategories
    RosterSlot:
      type: object
      properties:
        position:
          type: string
        count:
          type: integer
          format: int32
      required:
      - count
      - position
    StatCategory:
      type: object
      properties:
        statId:
          type: integer
          format: int32
        name:
          type: string
        pointValue:
          type: number
          format: double
      required:
      - name
      - statId
    CredentialStatusResponse:
      type: object
      properties:
        hasCredentials:
          type: boolean
          description: Whether the user has stored ESPN cookies (for private leagues).
      required:
      - hasCredentials
    CredentialValuesResponse:
      type: object
      properties:
        espnS2:
          type: string
          description: The stored espn_s2 cookie.
        swid:
          type: string
          description: The stored SWID cookie.
      required:
      - espnS2
      - swid
