openapi: 3.1.0
info:
  title: Fantasy Player Service API
  description: "Aggregated player read model: NHL stats merged with Yahoo fantasy\
    \ eligible positions, for the fantasy hockey tool."
  version: v1
servers:
- url: /
tags:
- name: Players
  description: Merged NHL stats + Yahoo fantasy positions
- name: Sync
  description: Refresh the merged player data from nhl-service + yahoo-service
paths:
  /api/v1/sync:
    post:
      tags:
      - Sync
      summary: Trigger a player sync
      description: "Pulls NHL stats + Yahoo positions, matches and upserts them. Runs\
        \ asynchronously; returns 202 immediately, or 409 if a sync is already running."
      operationId: triggerSync
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
        "409":
          description: A sync is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
  /api/v1/players/skaters:
    get:
      tags:
      - Players
      summary: All skaters with stats + eligible positions
      operationId: skaters
      responses:
        "200":
          description: Skaters returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkaterResponse"
  /api/v1/players/goalies:
    get:
      tags:
      - Players
      summary: All goalies with stats + eligible positions
      operationId: goalies
      responses:
        "200":
          description: Goalies returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalieResponse"
components:
  schemas:
    SyncAcceptedResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    SkaterResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        position:
          type: string
        eligiblePositions:
          type: array
          description: Yahoo fantasy eligible positions; falls back to the NHL position
            when unmatched
          items:
            type: string
        sweaterNumber:
          type: integer
          format: int32
        teamAbbrev:
          type: string
        headshot:
          type: string
        gamesPlayed:
          type: integer
          format: int32
        goals:
          type: integer
          format: int32
        assists:
          type: integer
          format: int32
        points:
          type: integer
          format: int32
        plusMinus:
          type: integer
          format: int32
        pim:
          type: integer
          format: int32
        powerPlayGoals:
          type: integer
          format: int32
        powerPlayPoints:
          type: integer
          format: int32
        shorthandedGoals:
          type: integer
          format: int32
        shorthandedPoints:
          type: integer
          format: int32
        gameWinningGoals:
          type: integer
          format: int32
        otGoals:
          type: integer
          format: int32
        shots:
          type: integer
          format: int32
        shootingPctg:
          type: number
          format: double
        avgToi:
          type: string
        faceoffWinningPctg:
          type: number
          format: double
        hits:
          type: integer
          format: int32
        blockedShots:
          type: integer
          format: int32
        totalFaceoffWins:
          type: integer
          format: int32
        totalFaceoffLosses:
          type: integer
          format: int32
      required:
      - eligiblePositions
      - firstName
      - id
      - lastName
      - position
    GoalieResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        position:
          type: string
        eligiblePositions:
          type: array
          description: Yahoo fantasy eligible positions; falls back to the NHL position
            when unmatched
          items:
            type: string
        sweaterNumber:
          type: integer
          format: int32
        teamAbbrev:
          type: string
        headshot:
          type: string
        gamesPlayed:
          type: integer
          format: int32
        gamesStarted:
          type: integer
          format: int32
        wins:
          type: integer
          format: int32
        losses:
          type: integer
          format: int32
        otLosses:
          type: integer
          format: int32
        shutouts:
          type: integer
          format: int32
        shotsAgainst:
          type: integer
          format: int32
        saves:
          type: integer
          format: int32
        goalsAgainst:
          type: integer
          format: int32
        goalsAgainstAvg:
          type: number
          format: double
        savePctg:
          type: number
          format: double
      required:
      - eligiblePositions
      - firstName
      - id
      - lastName
      - position
