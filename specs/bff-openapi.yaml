openapi: 3.1.0
info:
  title: Fantasy Hockey BFF API
  description: Backend for Frontend aggregation layer for the Fantasy Hockey application
  version: "1.0"
servers:
- url: /
security:
- bearerAuth: []
tags:
- name: Authentication
  description: Register and login endpoints
- name: Shared projections
  description: "Public, read-only projections (no sign-in required)"
- name: Admin
  description: "Admin-only: Yahoo service account + player sync"
- name: Projection shares
  description: The current user's public links to their projections
- name: Account
  description: The signed-in account's own profile
- name: Yahoo
  description: The authenticated user's Yahoo fantasy account and leagues
- name: Players
  description: "NHL player stats endpoints (public, read-only)"
- name: Projections
  description: The authenticated user's saved player projections
- name: Projection model
  description: "Model-generated projection lines, and measured totals over a range\
    \ of games. Data © MoneyPuck.com, used under its non-commercial terms."
- name: Versions
  description: Deployed version and reachability of every service
- name: ESPN
  description: The authenticated user's ESPN fantasy leagues
- name: Billing
  description: "Subscription checkout, customer portal and premium entitlements"
paths:
  /api/v1/projections/{id}:
    get:
      tags:
      - Projections
      summary: "Fetch one of the current user's saved projections, including its data"
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Projection found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No such projection for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
    put:
      tags:
      - Projections
      summary: Update one of the current user's saved projections
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectionRequest"
        required: true
      responses:
        "200":
          description: Projection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No such projection for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: Another projection with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
    delete:
      tags:
      - Projections
      summary: Delete one of the current user's saved projections
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Projection deleted
        "404":
          description: No such projection for this user
  /api/v1/projections/{id}/share:
    get:
      tags:
      - Projection shares
      summary: Fetch the share link for one of the current user's projections
      operationId: getProjectionShare
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The projection is shared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "404":
          description: "No such projection for this user, or it is not shared"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
    put:
      tags:
      - Projection shares
      summary: Publish the projection's public snapshot
      description: "Idempotent: an already-shared projection returns the link it has.\
        \ A published snapshot cannot be refreshed or withdrawn."
      operationId: shareProjection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareProjectionRequest"
        required: true
      responses:
        "200":
          description: "Share created, or the existing one returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "404":
          description: No such projection for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "409":
          description: The account has no username yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
  /api/v1/espn/credentials:
    get:
      tags:
      - ESPN
      summary: Whether the user has stored ESPN cookies (for private leagues)
      operationId: credentialStatus
      responses:
        "200":
          description: Status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialStatusResponse"
    put:
      tags:
      - ESPN
      summary: Store (or replace) the user's ESPN cookies
      operationId: saveCredentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EspnCredentialsRequest"
        required: true
      responses:
        "204":
          description: Cookies stored
        "400":
          description: Missing or invalid cookie values
    delete:
      tags:
      - ESPN
      summary: Delete the user's stored ESPN cookies
      operationId: deleteCredentials
      responses:
        "204":
          description: Cookies deleted (or none existed)
  /api/v1/account/username:
    put:
      tags:
      - Account
      summary: Set the account's public name
      description: "The name shown wherever the account publishes something. Sharing\
        \ a projection requires one, which is the only thing that forces the choice."
      operationId: setUsername
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUsernameRequest"
        required: true
      responses:
        "200":
          description: Username set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          description: Validation failed (length or characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "409":
          description: Another account already holds that name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
  /api/v1/yahoo/connect:
    post:
      tags:
      - Yahoo
      summary: Start connecting the user's Yahoo account
      description: Returns the Yahoo consent URL the web app should redirect the browser
        to.
      operationId: connect
      responses:
        "200":
          description: Authorization URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeUrlResponse"
  /api/v1/projections:
    get:
      tags:
      - Projections
      summary: List the current user's saved projections (metadata only)
      operationId: list
      responses:
        "200":
          description: "The user's projections, newest first"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectionSummaryResponse"
    post:
      tags:
      - Projections
      summary: Save a new projection for the current user
      description: "Send `source` with an empty `data.players` to have the server\
        \ fill the player rows in from its own read model, instead of uploading ~1600\
        \ players the client just downloaded. Send `data.players` (and no `source`)\
        \ when the rows are user-specific, e.g. copied or carried over from the demo."
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectionRequest"
        required: true
      responses:
        "201":
          description: Projection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: A projection of that kind already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
  /api/v1/projections/imports:
    post:
      tags:
      - Projections
      summary: "Copy a shared projection into the current user's own, by its share\
        \ token"
      description: "Anyone holding a share link may copy the board behind it and draft\
        \ against it. The copy is of the snapshot as it was published, carries none\
        \ of the author's draft, and records who shared it."
      operationId: importFromShare
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportProjectionRequest"
        required: true
      responses:
        "201":
          description: Projection imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No share with that token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: An imported projection with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
  /api/v1/billing/portal-session:
    post:
      tags:
      - Billing
      summary: Open the billing management portal
      description: Returns the provider-hosted customer-portal URL for managing or
        cancelling the subscription.
      operationId: portalSession
      responses:
        "200":
          description: Portal URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUrlResponse"
        "404":
          description: "Payments not enabled, or the user has no billing customer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUrlResponse"
  /api/v1/billing/checkout-session:
    post:
      tags:
      - Billing
      summary: Start a checkout session to subscribe
      description: Returns the provider-hosted checkout URL the web app should redirect
        the browser to.
      operationId: checkoutSession
      responses:
        "200":
          description: Checkout URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrlResponse"
        "404":
          description: Payments are not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrlResponse"
  /api/v1/auth/verify:
    post:
      tags:
      - Authentication
      summary: Verify an email address with a token
      description: Consumes a single-use verification token from the email link and
        marks the account's email verified.
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "200":
          description: Email verified
        "400":
          description: "Invalid or expired token, or validation error"
  /api/v1/auth/verify/resend:
    post:
      tags:
      - Authentication
      summary: Resend the verification email
      description: "Always returns 200. To avoid revealing whether an account exists,\
        \ the response is identical whether or not a verification email was sent."
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
        required: true
      responses:
        "200":
          description: Request accepted (an email is sent only if a matching unverified
            account exists)
        "400":
          description: Validation error
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register
      description: Create a new user account and return an authenticated session
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: User registered and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Email already in use or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh tokens
      description: Exchange a valid refresh token for a new access token and refresh
        token pair
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/password/reset:
    post:
      tags:
      - Authentication
      summary: Reset password with a token
      description: Consumes a single-use reset token from the email link and sets
        a new password.
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          description: Password updated
        "400":
          description: "Invalid or expired token, or validation error"
  /api/v1/auth/password/forgot:
    post:
      tags:
      - Authentication
      summary: Request a password reset email
      description: "Always returns 200. To avoid revealing whether an account exists,\
        \ the response is identical whether or not a reset email was sent."
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "200":
          description: Request accepted (an email is sent only if a matching password
            account exists)
        "400":
          description: Validation error
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: Authenticate with email and password to receive a JWT
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/google:
    post:
      tags:
      - Authentication
      summary: Login with Google
      description: "Verify a Google ID token and log the user in, registering a new\
        \ account on first login"
      operationId: googleLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
        required: true
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid Google ID token or unverified email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/google/code:
    post:
      tags:
      - Authentication
      summary: Login with a Google authorization code
      description: "Exchange a Google OAuth authorization code (from the top-level\
        \ redirect flow) for an ID token server-side and log the user in, registering\
        \ a new account on first login. Used by browsers that block the embedded Google\
        \ Sign-In button, such as iOS Safari."
      operationId: googleCodeLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCodeLoginRequest"
        required: true
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: "Invalid or expired authorization code, or unverified email"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Unrecognized redirect URI or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/facebook:
    post:
      tags:
      - Authentication
      summary: Login with Facebook
      description: "Verify a Facebook access token and log the user in, registering\
        \ a new account on first login"
      operationId: facebookLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacebookLoginRequest"
        required: true
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid Facebook access token or missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/admin/yahoo/connect:
    post:
      tags:
      - Admin
      summary: Start connecting the Yahoo service account
      description: Returns the Yahoo consent URL to send the admin's browser to. The
        resulting token is stored under the reserved service-account id.
      operationId: connectYahooServiceAccount
      responses:
        "200":
          description: Authorization URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeUrlResponse"
  /api/v1/admin/player/sync:
    post:
      tags:
      - Admin
      summary: Trigger a player sync
      description: Refreshes the cached player read model from Yahoo.
      operationId: triggerPlayerSync
      responses:
        "200":
          description: Sync triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
  /api/v1/admin/player-ids/remap:
    post:
      tags:
      - Admin
      summary: Remap saved player ids from Yahoo's numbering to ESPN's
      description: "Matches the Yahoo player pool to the ESPN one and rewrites the\
        \ ids in every saved projection, draft pick and share. Reports the match before\
        \ the write, and defaults to a dry run: pass dryRun=false to actually apply\
        \ it. A one-way move — the app should be serving the ESPN pool afterwards."
      operationId: remapPlayerIds
      parameters:
      - name: dryRun
        in: query
        description: Write nothing and report what would change. Defaults to true.
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: "Match reported, and applied unless it was a dry run"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerIdRemapReport"
        "502":
          description: "Either pool came back short, or too little of the Yahoo pool\
            \ matched to apply"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerIdRemapReport"
  /api/v1/yahoo/leagues:
    get:
      tags:
      - Yahoo
      summary: List the user's NHL fantasy leagues
      operationId: leagues
      responses:
        "200":
          description: Leagues returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguesResponse"
        "404":
          description: User has not connected Yahoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguesResponse"
  /api/v1/yahoo/leagues/{leagueKey}/teams:
    get:
      tags:
      - Yahoo
      summary: List a league's teams (names + which is the user's own)
      operationId: teams
      parameters:
      - name: leagueKey
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Teams returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueTeamsResponse"
        "404":
          description: User has not connected Yahoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueTeamsResponse"
  /api/v1/yahoo/leagues/{leagueKey}/projection-settings:
    get:
      tags:
      - Yahoo
      summary: Get a league's settings mapped to projection settings
      description: "Maps the Yahoo league's scoring basis (points vs category), active\
        \ stat columns, point weights, roster slots and size into the projection's\
        \ own shape."
      operationId: projectionSettings
      parameters:
      - name: leagueKey
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Mapped settings returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueProjectionSettingsResponse"
        "404":
          description: User has not connected Yahoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueProjectionSettingsResponse"
  /api/v1/yahoo/connection:
    get:
      tags:
      - Yahoo
      summary: Whether the user has connected their Yahoo account
      operationId: connection
      responses:
        "200":
          description: Connection status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
  /api/v1/versions:
    get:
      tags:
      - Versions
      summary: Get service versions
      description: Returns the deployed version and reachability of the BFF and each
        downstream service
      operationId: getVersions
      responses:
        "200":
          description: Versions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionsResponse"
  /api/v1/shared/{token}:
    get:
      tags:
      - Shared projections
      summary: Fetch a shared projection by its token
      description: "Public: anyone holding the link can read it. A signed-in reader\
        \ gets the whole published board; anyone else gets its top rows, with `truncated`\
        \ set and `totalPlayers` saying what the board holds. Returns the snapshot\
        \ as it was when shared, with no identity beyond the owner's public username."
      operationId: getSharedProjection
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Shared projection found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedProjectionResponse"
        "404":
          description: "No share with that token, or it was taken down"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedProjectionResponse"
  /api/v1/projection-model/splits/skaters:
    get:
      tags:
      - Projection model
      summary: Skaters' measured totals over a range of a season's games
      description: "What players actually produced over a stretch of their team's\
        \ schedule — measured, not projected. Ranges are in team game numbers, so\
        \ the same range covers the same stretch for every player; one who missed\
        \ some of them shows fewer games. Give either fromGame/toGame or lastGames;\
        \ with neither, the whole season is covered."
      operationId: skaterSplits
      parameters:
      - name: season
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: fromGame
        in: query
        description: First team game in the range (1-based)
        required: false
        schema:
          type: integer
          format: int32
          maximum: 84
          minimum: 1
      - name: toGame
        in: query
        description: "Last team game in the range, inclusive"
        required: false
        schema:
          type: integer
          format: int32
          maximum: 84
          minimum: 1
      - name: lastGames
        in: query
        description: Shorthand for the team's final N games
        required: false
        schema:
          type: integer
          format: int32
          maximum: 84
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
          maximum: 1000
          minimum: 1
      responses:
        "200":
          description: "Totals over the range, highest scoring first"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerSplitResponse"
  /api/v1/projection-model/splits/goalies:
    get:
      tags:
      - Projection model
      summary: Goalies' measured totals over a range of a season's games
      operationId: goalieSplits
      parameters:
      - name: season
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: fromGame
        in: query
        required: false
        schema:
          type: integer
          format: int32
          maximum: 84
          minimum: 1
      - name: toGame
        in: query
        required: false
        schema:
          type: integer
          format: int32
          maximum: 84
          minimum: 1
      - name: lastGames
        in: query
        required: false
        schema:
          type: integer
          format: int32
          maximum: 84
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
          maximum: 1000
          minimum: 1
      responses:
        "200":
          description: Totals over the range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerSplitResponse"
  /api/v1/projection-model/seed:
    get:
      tags:
      - Projection model
      summary: Generate projection lines for every mapped player
      description: "Returns the model's projected stat lines keyed by this platform's\
        \ player id, ready to be saved as a new projection. Scoring settings are not\
        \ included — those belong to the user's league, so the client supplies them\
        \ when saving."
      operationId: seed
      parameters:
      - name: season
        in: query
        description: Season to project; defaults to the configured one
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Generated lines plus a summary of what was skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeededProjectionResponse"
  /api/v1/players/{playerId}/headshot:
    get:
      tags:
      - Players
      summary: Get a player's headshot
      description: The thumbnail yahoo-service renders from the player's headshot.
        This is what the `headshot` path on a skater or goalie points at; the source
        images themselves are multi-megapixel originals and are never served to a
        browser.
      operationId: getHeadshot
      parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Headshot returned
          content:
            image/png:
              schema:
                type: string
                format: byte
        "404":
          description: No headshot for this player
          content:
            image/png:
              schema:
                type: string
                format: byte
        "502":
          description: Player service unavailable
          content:
            image/png:
              schema:
                type: string
                format: byte
  /api/v1/players/skaters:
    get:
      tags:
      - Players
      summary: Get skaters
      description: "Skaters with full season stats, highest scoring first. `limit`\
        \ returns only that many, for a caller that wants the top of the board rather\
        \ than the whole pool — the editor needs every player, a preview needs five."
      operationId: getSkaters
      parameters:
      - name: limit
        in: query
        description: How many skaters to return; all of them when absent
        required: false
        schema:
          type: integer
          format: int32
          maximum: 500
          minimum: 1
      responses:
        "200":
          description: Skaters retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkaterResponse"
        "400":
          description: limit is not between 1 and 500
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkaterResponse"
        "502":
          description: NHL service unavailable
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkaterResponse"
  /api/v1/players/rookies:
    get:
      tags:
      - Players
      summary: Which players are rookies
      description: "Player ids of the rookies for the season being projected, by the\
        \ NHL's rule: under 26 on September 15, no earlier season of 25+ games, and\
        \ no two earlier seasons of more than 6. Answers known=false when rookie status\
        \ cannot be determined, which is not the same as there being none."
      operationId: getRookies
      responses:
        "200":
          description: "Rookies returned, or reported as unknown"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RookiesResponse"
  /api/v1/players/goalies:
    get:
      tags:
      - Players
      summary: Get goalies
      description: "Goalies with full season stats, most wins first. `limit` returns\
        \ only that many, the same way it does for skaters."
      operationId: getGoalies
      parameters:
      - name: limit
        in: query
        description: How many goalies to return; all of them when absent
        required: false
        schema:
          type: integer
          format: int32
          maximum: 500
          minimum: 1
      responses:
        "200":
          description: Goalies retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalieResponse"
        "400":
          description: limit is not between 1 and 500
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalieResponse"
        "502":
          description: NHL service unavailable
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalieResponse"
  /api/v1/espn/leagues/{leagueId}/teams:
    get:
      tags:
      - ESPN
      summary: List an ESPN league's teams (names + which is the user's own)
      operationId: teams_1
      parameters:
      - name: leagueId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Teams returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EspnLeagueTeamsResponse"
        "400":
          description: League is private (cookies missing/invalid) or the league id
            is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EspnLeagueTeamsResponse"
        "404":
          description: No such ESPN league for that id in the current or previous
            season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EspnLeagueTeamsResponse"
  /api/v1/espn/leagues/{leagueId}/projection-settings:
    get:
      tags:
      - ESPN
      summary: Get an ESPN league's settings mapped to projection settings
      description: "Maps the ESPN league's scoring basis (points vs category), active\
        \ stat columns, point weights, roster slots and size into the projection's\
        \ own shape."
      operationId: projectionSettings_1
      parameters:
      - name: leagueId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Mapped settings returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueProjectionSettingsResponse"
        "400":
          description: League is private (cookies missing/invalid) or the league id
            is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueProjectionSettingsResponse"
        "404":
          description: No such ESPN league for that id in the current or previous
            season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueProjectionSettingsResponse"
  /api/v1/espn/credentials/values:
    get:
      tags:
      - ESPN
      summary: The caller's own stored ESPN cookies
      description: Returns the stored espn_s2 and SWID so the import form can show
        the user their saved connection. Scoped to the JWT subject — a caller can
        only ever read their own. 404 when they have stored none.
      operationId: credentialValues
      responses:
        "200":
          description: Cookies returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialValuesResponse"
        "404":
          description: Caller has no stored cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialValuesResponse"
  /api/v1/billing/entitlements:
    get:
      tags:
      - Billing
      summary: The current user's premium entitlement
      description: Live read of whether the user's subscription currently grants premium
        access.
      operationId: entitlements
      responses:
        "200":
          description: Entitlement returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementsResponse"
  /api/v1/admin/yahoo/probe:
    get:
      tags:
      - Admin
      summary: Ask Yahoo whether it will serve a game's players
      description: "One live call, reporting the status Yahoo answered with and its\
        \ own error wording. A failing sync only says that something was refused;\
        \ vary the game key and season here to find out what. Reads nothing into the\
        \ cache and writes nothing."
      operationId: probeYahooAccess
      parameters:
      - name: gameKey
        in: query
        description: "Yahoo game: \"nhl\" for the current season, or a numeric key\
          \ to pin a past one"
        required: false
        schema:
          type: string
          default: nhl
      - name: season
        in: query
        description: Season start year; omit to send no season filter at all
        required: false
        schema:
          type: string
      - name: leagueKey
        in: query
        description: "Ask this league's players instead of the whole game's. The granted\
          \ Yahoo scope is about leagues, so this may be served where a game is refused\
          \ — and that difference is the diagnosis."
        required: false
        schema:
          type: string
      - name: target
        in: query
        description: "Set to \"leagues\" to ask the floor question instead: can this\
          \ account list its own leagues at all? Everything else is ignored. A refusal\
          \ here means no route into the Fantasy API is open, not that the wrong one\
          \ was chosen."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "What Yahoo answered, refusal included"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooProbeResponse"
  /api/v1/admin/yahoo/leagues:
    get:
      tags:
      - Admin
      summary: The Yahoo service account's own leagues
      description: "Hands you a league key for the probe without hunting for one,\
        \ and is itself a test: succeeding here while a game probe is refused places\
        \ the refusal on what was asked for rather than on who asked."
      operationId: yahooServiceAccountLeagues
      responses:
        "200":
          description: Leagues returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguesResponse"
  /api/v1/admin/yahoo/connection:
    get:
      tags:
      - Admin
      summary: Whether the Yahoo service account is connected
      operationId: yahooServiceConnection
      responses:
        "200":
          description: Connection status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
  /api/v1/admin/player/sync/runs:
    get:
      tags:
      - Admin
      summary: Recent player sync runs
      description: Outcome (counts) and the diff (players added/removed) of the most
        recent syncs.
      operationId: playerSyncRuns
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: Runs returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncRunResponse"
  /api/v1/account:
    get:
      tags:
      - Account
      summary: Fetch the signed-in account's profile
      operationId: getAccount
      responses:
        "200":
          description: Profile returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
components:
  schemas:
    DraftPick:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        teamId:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - playerId
      - teamId
    DraftState:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/DraftTeam"
          maxItems: 32
          minItems: 0
        order:
          type: array
          items:
            type: string
            maxLength: 64
            minLength: 0
          maxItems: 32
          minItems: 0
        picks:
          type: array
          items:
            $ref: "#/components/schemas/DraftPick"
        finishedAt:
          type: string
          format: date-time
      required:
      - order
      - picks
      - teams
    DraftTeam:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 0
        name:
          type: string
          maxLength: 64
          minLength: 0
        mine:
          type: boolean
      required:
      - id
      - mine
      - name
    EspnSync:
      type: object
      properties:
        leagueName:
          type: string
          maxLength: 200
          minLength: 0
        leagueId:
          type: string
          maxLength: 50
          minLength: 0
        syncedAt:
          type: string
          format: date-time
      required:
      - leagueId
      - leagueName
      - syncedAt
    PlayerProjection:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        type:
          type: string
          enum:
          - skater
          - goalie
        stats:
          $ref: "#/components/schemas/PlayerStats"
      required:
      - playerId
      - stats
      - type
    PlayerStats:
      type: object
      properties:
        utility:
          type: object
          additionalProperties:
            type: number
            format: double
        scoring:
          type: object
          additionalProperties:
            type: number
            format: double
      required:
      - scoring
      - utility
    ProjectionSettings:
      type: object
      properties:
        scoringType:
          type: string
          enum:
          - points
          - category
        statWeights:
          type: object
          additionalProperties:
            type: number
            format: double
        activeScoringColumns:
          type: array
          items:
            type: string
        activeUtilityColumns:
          type: array
          items:
            type: string
        scaleSettings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ScaleConfig"
        decimalSettings:
          type: object
          additionalProperties:
            type: integer
            format: int32
        useDefaultDecimals:
          type: boolean
        leagueSize:
          type: integer
          format: int32
          maximum: 30
          minimum: 2
        rosterSlots:
          $ref: "#/components/schemas/RosterSlots"
        minGoalieGames:
          type: integer
          format: int32
          maximum: 82
          minimum: 0
        yahooSync:
          $ref: "#/components/schemas/YahooSync"
        espnSync:
          $ref: "#/components/schemas/EspnSync"
        lastEspnLeagueId:
          type: string
          maxLength: 50
          minLength: 0
        playerBasis:
          type: string
          enum:
          - last_season
          - blank
        playerPoolSyncedAt:
          type: string
          format: date-time
      required:
      - activeScoringColumns
      - activeUtilityColumns
      - decimalSettings
      - scaleSettings
      - scoringType
      - statWeights
      - useDefaultDecimals
    RosterSlots:
      type: object
      properties:
        c:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        lw:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        rw:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        d:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        util:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        bn:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        g:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
      required:
      - bn
      - c
      - d
      - g
      - lw
      - rw
      - util
    ScaleConfig:
      type: object
      properties:
        scale:
          type: boolean
        scalableStats:
          type: array
          items:
            type: string
      required:
      - scalableStats
      - scale
    UpdateProjectionData:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/ProjectionSettings"
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerProjection"
        draft:
          $ref: "#/components/schemas/DraftState"
        tings:
          $ref: "#/components/schemas/UpdateProjectionData"
          writeOnly: true
      required:
      - settings
    UpdateProjectionRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        data:
          $ref: "#/components/schemas/UpdateProjectionData"
      required:
      - data
      - name
    YahooSync:
      type: object
      properties:
        leagueName:
          type: string
          maxLength: 200
          minLength: 0
        leagueKey:
          type: string
          maxLength: 100
          minLength: 0
        syncedAt:
          type: string
          format: date-time
      required:
      - leagueKey
      - leagueName
      - syncedAt
    PoolReconciliation:
      type: object
      properties:
        added:
          type: integer
          format: int32
      required:
      - added
    ProjectionData:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/ProjectionSettings"
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerProjection"
          maxItems: 2000
          minItems: 0
        draft:
          $ref: "#/components/schemas/DraftState"
        tings:
          $ref: "#/components/schemas/ProjectionData"
          writeOnly: true
      required:
      - players
      - settings
    ProjectionOrigin:
      type: object
      properties:
        shareToken:
          type: string
        authorUsername:
          type: string
      required:
      - authorUsername
      - shareToken
    ProjectionResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - projection
          - preset_draft
          - imported
        season:
          type: string
          description: "The season this projection is for, as its 8-digit code."
        data:
          $ref: "#/components/schemas/ProjectionData"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        origin:
          $ref: "#/components/schemas/ProjectionOrigin"
          description: "Who this board was copied from, on a projection imported from\
            \ a share link. Absent on the user's own."
        poolReconciliation:
          $ref: "#/components/schemas/PoolReconciliation"
          description: "How many player rows this read added to match the current\
            \ player pool. Present only when the pool had moved since these rows were\
            \ last squared with it, so a client can say so once and then stop. Nothing\
            \ is removed by a reconciliation — a row whose player has left the pool\
            \ stays and is not shown."
      required:
      - createdAt
      - data
      - id
      - kind
      - name
      - season
      - updatedAt
    ShareProjectionRequest:
      type: object
      properties:
        players:
          type: array
          description: "The ranked rows to publish, in display order. A share carries\
            \ the whole board, so this is the client's entire ranking rather than\
            \ the top of it; the cap is a safety limit sized above the largest player\
            \ pool."
          items:
            $ref: "#/components/schemas/SharedPlayer"
          maxItems: 2000
          minItems: 0
      required:
      - players
    SharedPlayer:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 100
          minLength: 0
        teamAbbrev:
          type: string
          maxLength: 10
          minLength: 0
        headshot:
          type: string
          maxLength: 300
          minLength: 0
        positions:
          type: array
          items:
            type: string
            maxLength: 4
            minLength: 0
          maxItems: 6
          minItems: 0
        type:
          type: string
          enum:
          - skater
          - goalie
        rank:
          type: integer
          format: int32
          minimum: 1
        value:
          type: number
          format: double
        stats:
          $ref: "#/components/schemas/PlayerStats"
      required:
      - name
      - playerId
      - rank
      - stats
      - type
      - value
    ShareLinkResponse:
      type: object
      properties:
        token:
          type: string
        shareUrl:
          type: string
          description: "The public link to share, e.g. https://slapstat.com/s/<token>"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - shareUrl
      - token
      - updatedAt
    EspnCredentialsRequest:
      type: object
      properties:
        espnS2:
          type: string
          description: The user's espn_s2 cookie value.
          maxLength: 1024
          minLength: 0
        swid:
          type: string
          description: The user's SWID cookie value (including the braces).
          maxLength: 128
          minLength: 0
      required:
      - espnS2
      - swid
    SetUsernameRequest:
      type: object
      properties:
        username:
          type: string
          description: "Letters, digits and underscores, 3–20 characters. Shown publicly\
            \ wherever the account publishes something."
          maxLength: 20
          minLength: 3
          pattern: "^[A-Za-z0-9_]+$"
      required:
      - username
    AccountResponse:
      type: object
      properties:
        email:
          type: string
        username:
          type: string
          description: "The account's public name; absent until the user picks one,\
            \ which sharing a projection requires"
      required:
      - email
    AuthorizeUrlResponse:
      type: object
      properties:
        authorizeUrl:
          type: string
      required:
      - authorizeUrl
    CreateProjectionRequest:
      type: object
      properties:
        name:
          type: string
          description: "Ignored for a preset draft, which the server names itself."
          maxLength: 100
          minLength: 0
        kind:
          type: string
          description: What the projection is for. Defaults to the user's own. A preset
            draft requires source=default and is named by the server.
          enum:
          - projection
          - preset_draft
          - imported
        data:
          $ref: "#/components/schemas/ProjectionData"
        source:
          type: string
          description: Fill data.players from the server's player read model instead
            of sending them. Requires data.players to be empty; omit it to send your
            own rows.
          enum:
          - default
          - blank
          - model
      required:
      - data
      - name
    ImportProjectionRequest:
      type: object
      properties:
        token:
          type: string
          description: "The token from the share link, i.e. the last segment of /s/{token}."
          maxLength: 64
          minLength: 0
        name:
          type: string
          description: What to call the copy. Defaults to the name it was shared under;
            send one to resolve a clash with a projection already imported.
          maxLength: 100
          minLength: 0
      required:
      - token
    PortalUrlResponse:
      type: object
      properties:
        portalUrl:
          type: string
          description: Provider-hosted customer-portal URL to redirect the browser
            to
      required:
      - portalUrl
    CheckoutUrlResponse:
      type: object
      properties:
        checkoutUrl:
          type: string
          description: Provider-hosted checkout URL to redirect the browser to
      required:
      - checkoutUrl
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - token
    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
      required:
      - email
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 8
      required:
      - email
      - password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
        refreshToken:
          type: string
        refreshExpiresInSeconds:
          type: integer
          format: int64
        admin:
          type: boolean
        emailVerified:
          type: boolean
          description: Whether the account's email address has been verified
      required:
      - admin
      - emailVerified
      - expiresInSeconds
      - refreshExpiresInSeconds
      - refreshToken
      - token
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 4096
          minLength: 0
      required:
      - refreshToken
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 128
          minLength: 0
        newPassword:
          type: string
          maxLength: 72
          minLength: 8
      required:
      - newPassword
      - token
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
      required:
      - email
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        password:
