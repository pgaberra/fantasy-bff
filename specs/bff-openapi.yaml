    PlayerIdRemapReport:
      type: object
      properties:
        yahooPlayers:
          type: integer
          format: int32
          description: Players in the Yahoo pool
        espnPlayers:
          type: integer
          format: int32
          description: Players in the ESPN pool
        matched:
          type: integer
          format: int32
          description: Yahoo players that found an ESPN counterpart
        matchedOnName:
          type: integer
          format: int32
          description: Matched on the full name
        matchedOnFallback:
          type: integer
          format: int32
          description: "Matched on last name plus first initial, where that form was\
            \ unique on both sides"
        unmatched:
          type: integer
          format: int32
        coverage:
          type: number
          format: double
          description: "Share of the whole Yahoo pool that found a counterpart. Read\
            \ the played coverage below instead: the pool is a frozen snapshot of\
            \ everyone who was fantasy-relevant last season, hundreds of whom never\
            \ got into a game and are simply not on the new platform's active list."
        playersWithGames:
          type: integer
          format: int32
          description: Yahoo players who played at least one game in the reference
            season
        matchedWithGames:
          type: integer
          format: int32
          description: How many of those found an ESPN counterpart
        coverageOfPlayersWithGames:
          type: number
          format: double
          description: Share of the players who actually played that found a counterpart.
            This is what the remap is gated on — they are the ones a projection has
            real numbers for.
        unmatchedSample:
          type: array
          description: "Yahoo players with no ESPN counterpart, busiest first and\
            \ with the games they played, at most 50 of them. A platform only lists\
            \ players with fantasy relevance, so a long tail of 0 GP here is expected;\
            \ anyone with a real season is how a broken match is noticed."
          items:
            type: string
        applied:
          $ref: "#/components/schemas/PlayerIdRemapResponse"
          description: "What db-service did with the crosswalk, or would have done\
            \ on a dry run"
      required:
      - applied
      - coverage
      - coverageOfPlayersWithGames
      - espnPlayers
      - matched
      - matchedOnFallback
      - matchedOnName
      - matchedWithGames
      - playersWithGames
      - unmatched
      - unmatchedSample
      - yahooPlayers
